<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistemas con parámetro: discusión y resolución</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<style>
  :root{
    --texto:#111; --verde-fondo:#E5FFE5; --verde-borde:#80FF80; --verde-titulo:#5CD65C;
    --azul:#1414E6; --rojo:#E01E1E; --gris:#666;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;color:var(--texto);cursor:pointer;
    font-family:"Latin Modern Roman","CMU Serif","Computer Modern Serif","Palatino Linotype",Palatino,Georgia,serif;
    font-size:20px;line-height:1.55;-webkit-tap-highlight-color:transparent}

  html,body{overflow:hidden}
  body{background:#fff}

  /* barra superior */
  .barra-sup{position:fixed;top:0;left:0;right:0;height:46px;z-index:5;background:#fff;border-bottom:1px solid #ddd;
    padding:0 14px;display:flex;gap:14px;align-items:center;font-size:.85rem;color:var(--gris)}
  .barra-sup .tit{font-weight:bold;color:#333;white-space:nowrap}
  .pestanas{display:flex;gap:6px;margin-left:auto;overflow-x:auto;scrollbar-width:none;padding:2px 0}
  .pestanas::-webkit-scrollbar{display:none}
  .pestanas button{font:inherit;font-size:.85rem;padding:3px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;
    background:#fff;border:1.5px solid #333;color:#333}
  .pestanas button[aria-selected="true"]{background:#333;color:#fff}

  /* barra inferior: botones grandes (pizarra digital) y progreso */
  .progreso{position:fixed;left:0;right:0;bottom:0;height:52px;z-index:5;background:#fff;border-top:1px solid #ddd;
    display:flex;align-items:center;gap:14px;padding:0 14px;font-size:.85rem;color:var(--gris)}
  .progreso .tira{flex:1;height:10px;background:#e8e8e8;border-radius:5px;overflow:hidden;cursor:pointer}
  .progreso .tira i{display:block;height:100%;background:#2e9e2e;transition:width .35s ease}
  .progreso .nav{font:inherit;font-size:1.5rem;line-height:1;width:64px;height:38px;border-radius:10px;cursor:pointer;
    background:#fff;border:2px solid #2e9e2e;color:#2e9e2e}
  .progreso .nav:active{background:#2e9e2e;color:#fff}
  .progreso .nav:disabled{opacity:.3;cursor:default}
  #contador{min-width:9.5em;text-align:right;white-space:nowrap}

  /* el libro: dos páginas, separadas solo por una línea fina */
  #libro{position:fixed;left:0;right:0;top:46px;bottom:52px;overflow:hidden;background:#fff;transition:opacity .25s ease}
  #libro.fuera{opacity:0}
  #pista{position:absolute;left:0;top:0;height:100%;will-change:transform}
  #pista.anim{transition:transform .9s cubic-bezier(.65,.05,.25,1)}
  .hoja{position:absolute;top:0;padding:6px 8px}
  .pag{position:relative;background:#fff;transform-origin:0 0;padding:30px 40px 0}
  .pag .cuerpo{display:flow-root;overflow:hidden}
  .pag .num{position:absolute;left:0;right:0;bottom:12px;text-align:center;color:#bbb;font-size:.8rem}
  #lomo{position:absolute;left:50%;top:14px;bottom:14px;width:0;border-left:1px solid #c9c9c9;pointer-events:none;z-index:2}
  .hoja.gira .pag{animation:gira .9s ease both}
  @keyframes gira{from{opacity:0}to{opacity:1}}
  @media (prefers-reduced-motion:reduce){#pista.anim{transition:none}.hoja.gira .pag{animation:none}}

  /* lo que se va escribiendo */
  .cont{opacity:0;transition:opacity .35s ease}
  .cont.on{opacity:1}
  .u{opacity:0;clip-path:inset(-40px 100% -40px -40px);transition:opacity .25s ease,clip-path .85s ease}
  span.u{display:block}
  .u.on{opacity:1;clip-path:inset(-40px -40px -40px -40px)}
  .u.rapido,.cont.rapido{transition:none}
  .cont.sigue{margin-top:0;padding-top:14px;border-top-left-radius:0;border-top-right-radius:0}
  .fila-menores{display:flex;justify-content:space-around;align-items:center;gap:.4em;margin:.8em 0}
  .fila-menores .sub{display:block}
  .fila-menores.col{flex-direction:column;align-items:center;gap:.1em;margin:.4em 0}
  h1{margin:0 0 6px;font-size:2.1rem;line-height:1.2}
  h4{margin:16px 0 6px;font-size:1.18rem}

  /* cajas verdes del modelo */
  .caja{position:relative;background:var(--verde-fondo);border:1.5px solid var(--verde-borde);
    border-radius:8px;padding:20px 20px 10px;margin:26px 0 14px}
  .caja>.titulo{position:absolute;top:-13px;left:12px;background:var(--verde-titulo);color:#fff;
    font-weight:bold;padding:1px 12px;border-radius:5px;font-size:.92rem}
  .caja.enunciado{color:var(--azul);margin-top:6px;padding-top:12px}
  .caja p{margin:.3em 0 .5em}
  .paso{margin:6px 0 10px}

  /* matrices con menores marcados en caja roja */
  .ec{display:flex;align-items:center;justify-content:center;gap:.5em;margin:.6em 0;flex-wrap:wrap}
  .mat{--w:2.5em;--h:1.7em;position:relative;display:inline-grid;
    grid-template-columns:repeat(var(--nc),var(--w));grid-auto-rows:var(--h);
    margin:1.1em .7em .2em;text-align:center}
  .mat .c{display:flex;align-items:center;justify-content:center;white-space:nowrap}
  .mat::before,.mat::after{content:"";position:absolute;top:-.15em;bottom:-.15em;width:.55em;border:2px solid #111}
  .mat::before{left:-.7em;border-right:0;border-radius:60% 0 0 60%/50% 0 0 50%}
  .mat::after{right:-.7em;border-left:0;border-radius:0 60% 60% 0/0 50% 50% 0}
  .mat .bar{position:absolute;top:.1em;bottom:.1em;left:calc(var(--k) * var(--w));border-left:1.5px solid #111}
  .mat .caja-roja{position:absolute;border:1.5px solid var(--rojo);pointer-events:none;
    left:calc(var(--c0) * var(--w) + .15em);top:calc(var(--r0) * var(--h) + .12em);
    width:calc(var(--cs) * var(--w) - .3em);height:calc(var(--rs) * var(--h) - .24em)}
  .mat .caja-roja i{position:absolute;left:50%;top:-1.35em;transform:rotate(-40deg);transform-origin:left bottom;
    color:var(--rojo);font-style:normal;white-space:nowrap}
  .mat .tacha{position:absolute;left:-.2em;right:-.2em;top:calc((var(--r) + .5) * var(--h));
    border-top:1.5px solid var(--rojo);pointer-events:none}
  .mat .etq{position:absolute;left:calc((var(--c) + .5) * var(--w));top:-.15em;width:0;height:0;pointer-events:none}
  .mat .etq i{position:absolute;left:0;bottom:0;transform:rotate(-40deg);transform-origin:left bottom;
    color:var(--rojo);font-style:normal;white-space:nowrap}
  .instr{color:var(--azul);border:1.5px solid #E6C200;border-radius:14px;padding:6px 16px;margin:10px 0;text-align:center}
  .nota{color:var(--gris);font-size:.9em}
  b.res{color:var(--rojo)}
  .katex-display{margin:.6em 0;overflow-x:auto;overflow-y:hidden}
  table.res{border-collapse:collapse;margin:6px auto 8px}
  table.res th,table.res td{padding:5px 16px;text-align:center}
  table.res th{border-bottom:1.5px solid #111}
  table.res td:not(:last-child),table.res th:not(:last-child){border-right:1px solid #111}
  table.res td:last-child,table.res th:last-child{text-align:left}
</style>
</head>
<body>
<div class="barra-sup">
  <span class="tit">Sistemas con parámetro: discusión y resolución</span>
  <nav class="pestanas" id="pestanas" aria-label="Ejercicios"></nav>
</div>
<div id="libro"><div id="pista"></div><div id="lomo"></div></div>
<div id="stage" style="position:absolute;left:-99999px;top:0;width:720px;visibility:hidden"></div>
<div class="progreso">
  <button class="nav" id="btnAtras" title="Retroceder (←)">‹</button>
  <button class="nav" id="btnAdelante" title="Avanzar (→)">›</button>
  <div class="tira" id="tira"><i id="relleno"></i></div>
  <span id="contador"></span>
</div>

<script>
/* ---------------------------------------------------------------------
   Matriz con barra opcional y menor marcado en caja roja.
   rows: filas (cadenas LaTeX); opts.bar = nº de columnas antes de la barra;
   opts.box = [fila0, col0, fila1, col1] (empezando en 0)
   opts.tach = [filas a tachar]; opts.etq = [[columna, 'texto'], ...] (rótulo rojo sobre una columna)
   --------------------------------------------------------------------- */
function mat(rows, opts = {}) {
  const nr = rows.length, nc = rows[0].length;
  const largo = Math.max(...rows.map(r => Math.max(...r.map(c => String(c).replace(/\\[a-zA-Z]+|[{}\s]/g, '').length))));
  const ancho = Math.max(2.5, 1.0 + 0.55 * largo);
  let h = '<span class="mat" style="--nc:' + nc + ';--nr:' + nr + ';--w:' + ancho.toFixed(2) + 'em' + (opts.etq ? ';margin-top:2.3em' : '') + '">';
  rows.forEach(r => r.forEach(c => { h += '<span class="c">$' + c + '$</span>'; }));
  if (opts.bar != null) h += '<span class="bar" style="--k:' + opts.bar + '"></span>';
  if (opts.box) {
    /* box = [f0,c0,f1,c1] o, para un menor de columnas no contiguas, una lista de cajas;
       el rótulo ≠0 solo va en la primera */
    const cajas = Array.isArray(opts.box[0]) ? opts.box : [opts.box];
    cajas.forEach(([r0, c0, r1, c1], i) => {
      h += '<span class="caja-roja" style="--r0:' + r0 + ';--c0:' + c0 + ';--rs:' + (r1 - r0 + 1) +
           ';--cs:' + (c1 - c0 + 1) + '">' + (i === 0 ? '<i>$\\neq0$</i>' : '') + '</span>';
    });
  }
  if (opts.tach) opts.tach.forEach(r => { h += '<span class="tacha" style="--r:' + r + '"></span>'; });
  if (opts.etq) opts.etq.forEach(([c, t]) => { h += '<span class="etq" style="--c:' + c + '"><i>$' + t + '$</i></span>'; });
  return h + '</span>';
}
const ec = (...partes) => '<div class="ec">' + partes.join('') + '</div>';
const f = s => '<span>$' + s + '$</span>';

/* ---------------------------------------------------------------------
   Ayudantes para construir los pasos de un ejercicio con parámetro.
   --------------------------------------------------------------------- */
const rg = x => '\\operatorname{rg}(' + x + ')';
const detTex = filas => '\\begin{vmatrix} ' + filas.map(r => r.join('&')).join('\\\\ ') + ' \\end{vmatrix}';

/* forma matricial, determinante, valores críticos y conclusión del caso general */
function pasosInicio(o) {
  const fx = o.x.map(v => [v]), fb = o.b.map(v => [v]);
  return [
    { nueva: true, titulo: 'Escribimos el sistema en forma matricial',
      html: ec(mat(o.A), mat(fx), f('='), mat(fb)) +
            ec(f('\\text{Matriz de coeficientes: }'), mat(o.A)) +
            ec(f('\\text{Matriz ampliada: }'), mat(o.Ap, {bar: 3})) },
    { nueva: true, titulo: 'El determinante de la matriz de coeficientes es:', html: o.det },
    { nueva: true, titulo: 'Ahora resolvemos la ecuación $' + o.ecuacion + '$', html: o.resolucion },
    { nueva: true, caja: 'Conclusión', html: o.concl }
  ];
}

/* caso con rg(A)=rg(A')=2: tres menores nulos + combinación lineal por filas */
function pasosSCI(o) {
  return [
    { nueva: true, caja: 'Si ' + o.etiqueta,
      html: '<p><b>Si $' + o.valor + '$</b>, el sistema queda representado por la siguiente matriz:</p>' +
            ec(mat(o.Ap, {bar: 3})) },
    { titulo: 'Matriz $A$',
      html: ec(f('A='), mat(o.A, {box: o.boxA})) +
            '<p>Como $|A|=0$, $' + rg('A') + '<3$; y el menor marcado, $' + detTex(o.menorA) + '=' + o.valMenorA +
            '$, es distinto de cero.</p>$$' + rg('A') + '=2$$' },
    { nueva: true, titulo: "Matriz ampliada $A'$",
      html: ec(f("A'="), mat(o.Ap, {bar: 3, box: o.boxAp})) +
            '<p>El menor marcado es distinto de cero, luego $' + rg("A'") + '\\geq2$. ' +
            "Como $|A|=0$, solo falta calcular los otros tres menores de orden 3 de $A'$:</p>" +
            '<div class="fila-menores">' + o.menores.map(m => '<span class="sub">$\\displaystyle ' + detTex(m) + '=0$</span>').join('') + '</div>' +
            '<p>Todos los menores de orden 3 son nulos.</p>$$' + rg("A'") + '=2$$' },
    { nueva: true, titulo: "Otra manera de ver que $" + rg("A'") + "=2$", html: o.comb },
    { caja: 'Conclusión', html: o.concl }
  ];
}

/* caso con rg(A)=2 y rg(A')=3: menor de orden 3 distinto de cero */
function pasosSI(o) {
  return [
    { nueva: true, caja: 'Si ' + o.etiqueta,
      html: '<p><b>Si $' + o.valor + '$</b>, el sistema queda representado por la siguiente matriz:</p>' +
            ec(mat(o.Ap, {bar: 3})) },
    { titulo: 'Matriz $A$',
      html: ec(f('A='), mat(o.A, {box: o.boxA})) +
            '<p>Como $|A|=0$, $' + rg('A') + '<3$; y el menor marcado, $' + detTex(o.menorA) + '=' + o.valMenorA +
            '$, es distinto de cero.</p>$$' + rg('A') + '=2$$' },
    { nueva: true, titulo: "Matriz ampliada $A'$",
      html: ec(f("A'="), mat(o.Ap, {bar: 3, box: o.boxAp})) +
            '<p>El menor de orden 3 marcado' + (o.columnas ? ' (columnas ' + o.columnas + ')' : '') +
            ' vale $' + detTex(o.menor3) + '=' + o.valMenor3 + '\\neq0$.</p>$$' + rg("A'") + '=3$$' },
    { caja: 'Conclusión', html: o.concl }
  ];
}

/* caso con rg(A)=rg(A')=1: todas las filas proporcionales */
function pasosRango1(o) {
  const q = o.iguales ? 'son iguales' : 'son proporcionales';
  return [
    { nueva: true, caja: 'Si ' + o.etiqueta,
      html: '<p><b>Si $' + o.valor + '$</b>, el sistema queda representado por la siguiente matriz:</p>' +
            ec(mat(o.Ap, {bar: 3})) },
    { titulo: 'Matriz $A$',
      html: ec(f('A='), mat(o.A, {box: o.boxA})) +
            '<p>Como $|A|=0$, $' + rg('A') + '<3$. El elemento marcado es un menor de orden 1 distinto de cero, $' + o.elem +
            '\\neq0$, luego $' + rg('A') + '\\geq1$. Además las tres filas ' + q + ' ($' + o.rel +
            '$), así que todos los menores de orden 2 son nulos.</p>$$' + rg('A') + '=1$$' },
    { nueva: true, titulo: "Matriz ampliada $A'$",
      html: ec(f("A'="), mat(o.Ap, {bar: 3, box: o.boxAp})) +
            "<p>Las filas de $A'$ cumplen las mismas relaciones ($" + o.rel + "$): todos los menores de orden 2 y de orden 3 son nulos, " +
            'y el elemento marcado es distinto de cero.</p>$$' + rg("A'") + '=1$$' },
    { caja: 'Conclusión', html: o.concl }
  ];
}

/* ---------------------------------------------------------------------
   Ayudantes numéricos para los apartados de resolución (Cramer y Gauss)
   --------------------------------------------------------------------- */
const gcd = (a, b) => b ? gcd(b, a % b) : Math.abs(a);
const fr = (n, d) => {
  if (d < 0) { n = -n; d = -d; }
  const g = gcd(n, d) || 1; n /= g; d /= g;
  return d === 1 ? String(n) : (n < 0 ? '-' : '') + '\\frac{' + Math.abs(n) + '}{' + d + '}';
};
const det3 = M => M[0][0] * (M[1][1] * M[2][2] - M[1][2] * M[2][1])
                - M[0][1] * (M[1][0] * M[2][2] - M[1][2] * M[2][0])
                + M[0][2] * (M[1][0] * M[2][1] - M[1][1] * M[2][0]);
const suma = t => t.map((x, i) => (i && x >= 0) ? '+' + x : String(x)).join('');
function sarrusTex(M) {
  const a = M;
  const p = [a[0][0] * a[1][1] * a[2][2], a[0][1] * a[1][2] * a[2][0], a[0][2] * a[1][0] * a[2][1]];
  const n = [a[0][2] * a[1][1] * a[2][0], a[0][0] * a[1][2] * a[2][1], a[0][1] * a[1][0] * a[2][2]];
  return '(' + suma(p) + ')-(' + suma(n) + ')=' + det3(M);
}
const strs = M => M.map(r => r.map(String));
const X3 = [['x'], ['y'], ['z']];
const forma = (A, b) => ec(mat(A), mat(X3), f('='), mat(b.map(v => [v])));

/* Método 1: regla de Cramer para un sistema 3x3 numérico */
function pasosCramer(o) {
  const A = o.A.map(r => r.map(Number)), b = o.b.map(Number), D = det3(A);
  const sust = j => A.map((r, i) => r.map((v, k) => k === j ? b[i] : v));
  const Ds = [0, 1, 2].map(j => det3(sust(j)));
  const v = ['x', 'y', 'z'];
  const sub = j => '<span class="sub">$\\displaystyle \\det(A_' + v[j] + ')=' + detTex(strs(sust(j))) + '=' + Ds[j] + '$</span>';
  return [
    { nueva: true, titulo: 'Método 1: regla de Cramer para $' + o.nombre + '$',
      html: '<p>Calculamos el determinante de la matriz de coeficientes:</p>' +
            '$$\\det(A)=' + detTex(strs(A)) + '=' + sarrusTex(A) + '$$' +
            '<p>Ahora calculamos los determinantes para cada variable:</p>' +
            '<div class="fila-menores col">' + sub(0) + sub(1) + sub(2) + '</div>' },
    { caja: 'Regla de Cramer',
      html: '$$\\begin{aligned}' +
            v.map((n, j) => n + '&=\\frac{\\det(A_' + n + ')}{\\det(A)}=\\frac{' + Ds[j] + '}{' + D + '}=' + fr(Ds[j], D)).join('\\\\') +
            '\\end{aligned}$$' +
            '<p><b class="res">La solución del sistema es $x=' + fr(Ds[0], D) + ',\\ y=' + fr(Ds[1], D) + ',\\ z=' + fr(Ds[2], D) + '$.</b></p>' }
  ];
}

/* Método 2: Gauss. cadena = [[matriz, flecha TeX, matriz], ...]; pasos = despejes de abajo hacia arriba */
function pasosGauss(o) {
  let h = '<p>Hacemos ceros por debajo de la diagonal principal:</p>';
  o.cadena.forEach(c => { h += ec(mat(c[0], {bar: 3}), f(c[1]), mat(c[2], {bar: 3})); });
  h += '<p>La matriz ya es escalonada. Resolvemos de abajo hacia arriba:</p>';
  o.pasos.forEach(t => { h += '$$' + t + '$$'; });
  return [
    { nueva: true, titulo: 'Método 2: método de Gauss para $' + o.nombre + '$', html: h },
    { caja: 'Solución por Gauss', html: '<p><b class="res">La solución del sistema es $' + o.sol + '$.</b></p>' }
  ];
}

const INSTR_1 = '<p class="instr">Tachamos la fila que queda fuera del menor distinto de cero que hemos seleccionado ' +
  'y le damos a la variable cuya columna queda fuera del menor el valor del parámetro; en este caso $z=\\lambda$.</p>';

/* =====================================================================
   EJERCICIOS (los cinco de la hoja de ejercicios de sistemas con parámetro)
   ===================================================================== */
const EJERCICIOS = [

  /* ===================== EJERCICIO 1 (parámetro a) ===================== */
  {
    titulo: "Ejercicio 1",
    enunciado: String.raw`
      <p>Consideremos el siguiente sistema de ecuaciones lineales dependiente del parámetro $a$:</p>
      $$\left\{\begin{array}{l} x+y+z=2\\ x+2y+3z=3\\ x+3y+az=4 \end{array}\right.$$
      <p style="margin-left:1.6em">a)&nbsp; Discutir el sistema según los valores del parámetro $a$.</p>
      <p style="margin-left:1.6em">b)&nbsp; Resolverlo para $a=0$.</p>
      <p style="margin-left:1.6em">c)&nbsp; Resolverlo para $a=5$.</p>`,
    pasos: [].concat(
      pasosInicio({
        A: [['1','1','1'],['1','2','3'],['1','3','a']],
        x: ['x','y','z'], b: ['2','3','4'],
        Ap: [['1','1','1','2'],['1','2','3','3'],['1','3','a','4']],
        det: String.raw`
          $$\begin{vmatrix} 1&1&1\\ 1&2&3\\ 1&3&a \end{vmatrix}=(2a+3+3)-(2+9+a)$$
          <p class="nota">(regla de Sarrus)</p>
          $$= a-5$$`,
        ecuacion: 'a-5=0',
        resolucion: String.raw`<p>El valor de $a$ es:</p>
          $$a=5$$`,
        concl: String.raw`<p>Si $a\neq5$, entonces $\operatorname{rg}(A)=\operatorname{rg}(A')=3$
          (el determinante de $A$ no es nulo y $A'$ solo tiene 3 filas), por lo tanto el sistema es
          <b class="res">compatible determinado</b>.</p>`
      }),
      pasosSCI({
        etiqueta: 'a = 5', valor: 'a=5',
        A: [['1','1','1'],['1','2','3'],['1','3','5']],
        Ap: [['1','1','1','2'],['1','2','3','3'],['1','3','5','4']],
        boxA: [[0,0,1,1]], boxAp: [[0,0,1,1]],
        menorA: [['1','1'],['1','2']], valMenorA: '1',
        menores: [[['1','1','2'],['2','3','3'],['3','5','4']],
                  [['1','1','2'],['1','3','3'],['1','5','4']],
                  [['1','1','2'],['1','2','3'],['1','3','4']]],
        comb: String.raw`
          <p>Sería escribir una fila como combinación lineal de las otras (por filas):</p>

      /* ---- c) a ≠ 5 y a = 5 ---- */
      [{
        nueva: true, titulo: "c) Resolverlo cuando sea posible: si $a\\neq5$",
        html: String.raw`
          <p>Aplicamos la regla de Cramer:</p>
          <div class="fila-menores">
            <span class="sub">$\displaystyle D=\begin{vmatrix} 1&1&1\\ 1&2&3\\ 1&3&a \end{vmatrix}=a-5$</span>
            <span class="sub">$\displaystyle D_x=\begin{vmatrix} 2&1&1\\ 3&2&3\\ 4&3&a \end{vmatrix}=a-5$</span>
          </div>
          <div class="fila-menores">
            <span class="sub">$\displaystyle D_y=\begin{vmatrix} 1&2&1\\ 1&3&3\\ 1&4&a \end{vmatrix}=a-5$</span>
            <span class="sub">$\displaystyle D_z=\begin{vmatrix} 1&1&2\\ 1&2&3\\ 1&3&4 \end{vmatrix}=0$</span>
          </div>`
      }, {
        caja: "Solución para $a\\neq5$",
        html: String.raw`
          $$x=\frac{D_x}{D}=\frac{a-5}{a-5}=1\qquad y=\frac{D_y}{D}=\frac{a-5}{a-5}=1\qquad z=\frac{D_z}{D}=\frac{0}{a-5}=0$$
          <p class="nota">Para cualquier $a\neq5$ la solución es la misma: $(1,1,0)$.</p>`
      }, {
        nueva: true, titulo: "Resolución del sistema compatible indeterminado ($a=5$)",
        html: '<p>Cuando $a=5$ el sistema es compatible indeterminado.</p>' + INSTR_1 +

      }, {
        nueva: true, titulo: "Resolución del sistema",
        html: String.raw`
          <p>Eliminando la fila tachada y considerando $z=\lambda$, el sistema se reduce a:</p>
          $$\left\{\begin{array}{l} x+y+\lambda=2\\ x+2y+3\lambda=3 \end{array}\right.
            \;\Rightarrow\;
            \left\{\begin{array}{l} x+y=2-\lambda\\ x+2y=3-3\lambda \end{array}\right.$$
          <p>Restando la primera ecuación a la segunda:</p>
          $$y=(3-3\lambda)-(2-\lambda)=1-2\lambda$$
          <p>Sustituyendo en la primera ecuación:</p>
          $$x=2-\lambda-(1-2\lambda)=1+\lambda$$`
      }, {
        caja: "Solución general",
        html: String.raw`
          $$\left\{\begin{array}{l} x=1+\lambda\\ y=1-2\lambda\\ z=\lambda \end{array}\right.\qquad\lambda\in\mathbb{R}$$
          <p class="nota">Comprobación en la tercera ecuación: $(1+\lambda)+3(1-2\lambda)+5\lambda=4$.</p>
          <p>Representa una recta en el espacio; $\lambda$ fija la posición a lo largo de ella.</p>`
      }]
    )
  },

          <p><b class="res">El sistema es incompatible (no tiene solución) cuando $m=2$.</b></p>`
      }),
      pasosSCI({
        etiqueta: 'm = 5', valor: 'm=5',
        A: [['5','2','1'],['2','5','1'],['5','2','1']],
        Ap: [['5','2','1','1'],['2','5','1','5'],['5','2','1','1']],
        boxA: [0,0,1,1], boxAp: [0,0,1,1],
        menorA: [['5','2'],['2','5']], valMenorA: '21',
        menores: [[['2','1','1'],['5','1','5'],['2','1','1']],
                  [['5','1','1'],['2','1','5'],['5','1','1']],
                  [['5','2','1'],['2','5','5'],['5','2','1']]],
        comb: String.raw`
          <p>Sería escribir una fila como combinación lineal de las otras (por filas).
          Aquí las filas 1 y 3 de $A'$ son iguales:</p>
          $$F_1=(5,2,1,1)=F_3$$
          <p>La primera fila es combinación lineal de las otras (es igual a la tercera), luego $\operatorname{rg}(A')<3$;
          y como hay un menor de orden 2 distinto de cero, $\operatorname{rg}(A')=2$.</p>`,
        concl: String.raw`
          $$\operatorname{rg}(A)=\operatorname{rg}(A')=2<3=\text{n.º de incógnitas}$$
          <p><b class="res">El sistema es compatible indeterminado (infinitas soluciones) cuando $m=5$.</b></p>`
      }),
      [{
        nueva: true, caja: "Resumen",
        html: String.raw`
          <table class="res">
            <tr><th>Valor de $m$</th><th>$\operatorname{rg}(A)$</th><th>$\operatorname{rg}(A')$</th><th>Número de soluciones</th></tr>
            <tr><td>$m\neq2,\,5$</td><td>3</td><td>3</td><td>una única solución (SCD)</td></tr>
            <tr><td>$m=2$</td><td>2</td><td>3</td><td>ninguna (incompatible)</td></tr>
            <tr><td>$m=5$</td><td>2</td><td>2</td><td>infinitas (SCI)</td></tr>
          </table>`
      }],

      /* ---- b) m = 3 ---- */
      [{
        nueva: true, titulo: "b) Resolver, razonadamente, el sistema para $m=3$",
        html: '<p>Como $3\\neq2$ y $3\\neq5$, el sistema es compatible determinado. Escribimos el sistema en forma matricial:</p>' +
              forma([['3','2','1'],['2','3','1'],['5','2','1']], ['1','3','1'])
      }],
      pasosCramer({ nombre: 'm=3', A: [['3','2','1'],['2','3','1'],['5','2','1']], b: ['1','3','1'] }),
      pasosGauss({
        nombre: 'm=3',
        cadena: [
          [[['3','2','1','1'],['2','3','1','3'],['5','2','1','1']],
           '\\xrightarrow[F_3\\to 3F_3-5F_1]{F_2\\to 3F_2-2F_1}',
           [['3','2','1','1'],['0','5','1','7'],['0','-4','-2','-2']]],
          [[['3','2','1','1'],['0','5','1','7'],['0','-4','-2','-2']],
           '\\xrightarrow{F_3\\to 5F_3+4F_2}',
           [['3','2','1','1'],['0','5','1','7'],['0','0','-6','18']]]
        ],
        pasos: ['-6z=18\\ \\Rightarrow\\ z=-3',
                '5y+z=7\\ \\Rightarrow\\ 5y-3=7\\ \\Rightarrow\\ y=2',
                '3x+2y+z=1\\ \\Rightarrow\\ 3x+4-3=1\\ \\Rightarrow\\ x=0'],
        sol: 'x=0,\\ y=2,\\ z=-3'
      })
    )
  },

  /* ===================== EJERCICIO 5 (2 ecuaciones, parámetro k) ===================== */
  {
    titulo: "Ejercicio 5",
    enunciado: String.raw`
      <p><b>Problema 1.</b> a)&nbsp; Dado $k\in\mathbb{R}$, se considera el sistema de ecuaciones</p>
      $$\left\{\begin{array}{l} kx-y-z=1\\ x+ky+2kz=k \end{array}\right.$$
      <p style="margin-left:1.6em">Discutir el sistema según los valores del parámetro $k\in\mathbb{R}$ y resolverlo para $k=-1$.</p>`,
    pasos: [
      {
        nueva: true,
        titulo: "Escribimos el sistema en forma matricial",
        html:
          ec(mat([['k','-1','-1'],['1','k','2k']]), mat(X3), f('='), mat([['1'],['k']])) +
          ec(f('\\text{Matriz de coeficientes: }'), mat([['k','-1','-1'],['1','k','2k']])) +
          ec(f('\\text{Matriz ampliada: }'), mat([['k','-1','-1','1'],['1','k','2k','k']], {bar: 3}))
      },
      {
        nueva: true,
        titulo: "Rango de la matriz de coeficientes $A$",
        html:
          '<p>La matriz $A$ no es cuadrada (2 ecuaciones y 3 incógnitas), así que no tiene determinante. ' +
          'Como solo tiene dos filas, $\\operatorname{rg}(A)\\leq2$. Buscamos un menor de orden 2 distinto de cero para <i>cualquier</i> valor de $k$:</p>' +
          ec(f('A='), mat([['k','-1','-1'],['1','k','2k']], {box: [0,0,1,1]})) +
          '$$\\begin{vmatrix} k&-1\\\\ 1&k \\end{vmatrix}=k^2+1$$' +
          '<p>Como $k^2+1\\geq1>0$ para todo $k\\in\\mathbb{R}$, este menor nunca se anula.</p>' +
          '$$\\operatorname{rg}(A)=2\\quad\\text{para todo }k\\in\\mathbb{R}$$'
      },
      {
        nueva: true,
        titulo: "Matriz ampliada $A'$",
        html:
          ec(f("A'="), mat([['k','-1','-1','1'],['1','k','2k','k']], {bar: 3, box: [0,0,1,1]})) +
          "<p>También tiene dos filas, luego $\\operatorname{rg}(A')\\leq2$; y como contiene a $A$, $\\operatorname{rg}(A')\\geq\\operatorname{rg}(A)=2$.</p>" +
          "$$\\operatorname{rg}(A')=2\\quad\\text{para todo }k\\in\\mathbb{R}$$"
      },
      {
        nueva: true,
        caja: "Conclusión",
        html: String.raw`
          $$\operatorname{rg}(A)=\operatorname{rg}(A')=2<3=\text{n.º de incógnitas}$$
          <p><b class="res">El sistema es compatible indeterminado (infinitas soluciones, un parámetro libre) para todo $k\in\mathbb{R}$.</b></p>`
      },
      {
        nueva: true,
        titulo: "Resolverlo para $k=-1$",
        html:
          '<p>Si <b>$k=-1$</b>, el sistema queda representado por la siguiente matriz:</p>' +
          ec(mat([['-1','-1','-1','1'],['1','-1','-2','-1']], {bar: 3})) +
          '<p class="instr">Tachamos las filas que quedan fuera del menor distinto de cero que hemos seleccionado ' +
          '(aquí las dos filas entran en el menor, así que no se tacha ninguna) y le damos a la variable cuya columna ' +
          'queda fuera del menor el valor del parámetro; en este caso $z=\\lambda$.</p>' +
          ec(mat([['-1','-1','-1','1'],['1','-1','-2','-1']], {bar: 3, box: [0,0,1,1], etq: [[2, 'z=\\lambda']]})) +
          '$$\\begin{vmatrix} -1&-1\\\\ 1&-1 \\end{vmatrix}=1+1=2\\neq0$$'
      },
      {
        nueva: true,
        titulo: "Resolución del sistema",
        html: String.raw`
          <p>Considerando $z=\lambda$ y pasando $\lambda$ al segundo miembro, el sistema se reduce a:</p>
          $$\left\{\begin{array}{l} -x-y-\lambda=1\\ x-y-2\lambda=-1 \end{array}\right.
            \;\Rightarrow\;
            \left\{\begin{array}{l} -x-y=1+\lambda\\ x-y=-1+2\lambda \end{array}\right.$$
          <p>Sumando las dos ecuaciones:</p>
          $$-2y=(1+\lambda)+(-1+2\lambda)=3\lambda\;\Rightarrow\;y=-\frac{3\lambda}{2}$$
          <p>Sustituyendo en la segunda ecuación:</p>
          $$x=-1+2\lambda+y=-1+2\lambda-\frac{3\lambda}{2}=-1+\frac{\lambda}{2}$$`
      },
      {
        caja: "Solución general",
        html: String.raw`
          $$\left\{\begin{array}{l} x=-1+\dfrac{\lambda}{2}\\[2mm] y=-\dfrac{3\lambda}{2}\\[2mm] z=\lambda \end{array}\right.\qquad\lambda\in\mathbb{R}$$
          <p class="nota">Comprobación en la primera ecuación: $-x-y-z=1-\tfrac{\lambda}{2}+\tfrac{3\lambda}{2}-\lambda=1$.</p>
          <p>Representa una recta en el espacio (la intersección de dos planos); $\lambda$ fija la posición a lo largo de ella.</p>`
      },
      {
        nueva: true, caja: "Resumen",
        html: String.raw`
          <table class="res">
            <tr><th>Valor de $k$</th><th>$\operatorname{rg}(A)$</th><th>$\operatorname{rg}(A')$</th><th>Clasificación</th></tr>
            <tr><td>cualquier $k\in\mathbb{R}$</td><td>2</td><td>2</td><td>compatible indeterminado (infinitas)</td></tr>
          </table>`
      }
    ]
  }
];

/* ===================================================================== */
const OPCIONES_MATE = {
  delimiters: [
    {left: "$$", right: "$$", display: true},
    {left: "$",  right: "$",  display: false}
  ],
  throwOnError: false
};
const $ = id => document.getElementById(id);
function mate(el) { if (window.renderMathInElement) renderMathInElement(el, OPCIONES_MATE); }

/* ---------------------------------------------------------------------
   MOTOR DEL LIBRO
   - Cada ejercicio se trocea en "unidades" (un párrafo, una fórmula, una
     matriz...). Cada clic escribe la siguiente unidad.
   - Las unidades se reparten en páginas de tamaño fijo (como un libro).
     Cada valor crítico ("Si m = ...") empieza en página nueva.
   - Se ven dos páginas. Cuando se llena la de la derecha, pasa a ser la
     de la izquierda y aparece una página nueva a la derecha.
   --------------------------------------------------------------------- */
const LW = 800;                     // ancho lógico de una página (px)
let actual = 0;                     // ejercicio activo
let s = 0;                          // unidades escritas
let G = {};                         // geometría
let libro = null;                   // {unidades, paginas}
let Lprev = 0;

function geometria() {
  const W = $("libro").clientWidth, H = $("libro").clientHeight;
  const Sw = W / 2, k = (Sw - 20) / LW;
  G = { W, H, Sw, k, LH: (H - 20) / k };
}

/* trocea un ejercicio en secciones y unidades (se hace una sola vez) */
function extraer(e) {
  if (e._sec) return e._sec;
  const stage = $("stage"), secs = [];
  const add = (tipo, cab, html, salto, mismo) => {
    const d = document.createElement("div");
    d.innerHTML = html;
    stage.appendChild(d);
    mate(d);
    const unidades = [];
    d.childNodes.forEach(n => {
      if (n.nodeType === 1) unidades.push(n);
      else if (n.nodeType === 3 && n.textContent.trim()) {
        const sp = document.createElement("span"); sp.textContent = n.textContent; unidades.push(sp);
      }
    });
    let cabHTML = null;
    if (cab) { const c = document.createElement("div"); c.innerHTML = cab; mate(c); cabHTML = c.innerHTML; }
    secs.push({ tipo, cabHTML, unidades, salto: !!salto, mismo: !!mismo });
  };
  add("titulo", null, "<h1>" + e.titulo + "</h1>");
  add("enun", null, e.enunciado, false, true);      // título y enunciado salen juntos con un clic
  e.pasos.forEach(p => add(p.caja ? "caja" : "paso", p.caja || p.titulo, p.html, p.caja && /^Si /.test(p.caja)));
  stage.innerHTML = "";
  /* un "tic" = un clic. Cada sección es un bloque; dentro de una fila de menores
     (.fila-menores) cada .sub sale con su propio clic */
  let base = 0;
  secs.forEach(sc => {
    let cur = sc.mismo ? base : base + 1, nuevo = false;
    sc.unidades = sc.unidades.map(n => {
      if (nuevo) { cur++; nuevo = false; }
      const o = { n, t: cur, subs: [] };
      if (n.classList && n.classList.contains("fila-menores")) {
        n.querySelectorAll(".sub").forEach(sb => { cur++; o.subs.push({ n: sb, t: cur }); });
        nuevo = true;
      }
      return o;
    });
    base = cur;
  });
  e._T = base;
  e._sec = secs;
  return secs;
}

function crearCont(sc, sigue) {
  const c = document.createElement("div");
  c.className = "cont";
  if (sc.tipo === "caja") {
    c.classList.add("caja");
    if (!sigue) c.insertAdjacentHTML("afterbegin", '<span class="titulo">' + sc.cabHTML + "</span>");
  } else if (sc.tipo === "paso") {
    c.classList.add("paso");
    if (!sigue) c.insertAdjacentHTML("afterbegin", "<h4>" + sc.cabHTML + "</h4>");
  } else if (sc.tipo === "enun") {
    c.classList.add("caja", "enunciado");
  }
  if (sigue) c.classList.add("sigue");
  return c;
}

/* una fórmula más ancha que la página se reduce hasta caber */
function ajustar(u) {
  if (u.classList && u.classList.contains("fila-menores")) {
    u.style.zoom = "";
    if (u.scrollWidth > u.clientWidth + 2) u.style.zoom = String(Math.max(.55, u.clientWidth / u.scrollWidth * .97));
  }
  u.querySelectorAll(".katex-display").forEach(d => {
    const k = d.firstElementChild;
    if (!k) return;
    k.style.zoom = "";
    if (d.scrollWidth > d.clientWidth + 2) k.style.zoom = String(Math.max(.55, d.clientWidth / d.scrollWidth * .98));
  });
}

/* reparte las unidades en páginas del tamaño actual */
function paginar(secs, T) {
  secs.T = T;
  const pista = $("pista");
  pista.innerHTML = "";
  const paginas = [], unidades = [];
  const nueva = () => {
    const hoja = document.createElement("div");
    hoja.className = "hoja";
    hoja.style.cssText = "left:" + (paginas.length * G.Sw) + "px;width:" + G.Sw + "px;height:" + G.H + "px";
    const pag = document.createElement("div");
    pag.className = "pag";
    pag.style.cssText = "width:" + LW + "px;height:" + G.LH + "px;transform:scale(" + G.k + ")";
    const cu = document.createElement("div");
    cu.className = "cuerpo";
    cu.style.height = (G.LH - 34 - 56) + "px";
    const num = document.createElement("div");
    num.className = "num"; num.textContent = paginas.length + 1;
    pag.append(cu, num); hoja.appendChild(pag); pista.appendChild(hoja);
    const o = { hoja, cu };
    paginas.push(o);
    return o;
  };
  let pg = nueva();
  const desborda = () => pg.cu.scrollHeight > pg.cu.clientHeight + 1;
  secs.forEach(sc => {
    if (sc.salto && pg.cu.children.length) pg = nueva();
    let cont = crearCont(sc, false), puestas = 0;
    pg.cu.appendChild(cont);
    /* un bloque (lo que sale con un clic) nunca se parte entre dos páginas */
    const bloques = [];
    sc.unidades.forEach(un => {
      const ult = bloques[bloques.length - 1];
      if (ult && ult[0].t === un.t) ult.push(un); else bloques.push([un]);
    });
    bloques.forEach(bl => {
      bl.forEach(un => {
        un.n.classList.add("u"); un.n.classList.remove("on");
        un.subs.forEach(sb => { sb.n.classList.add("u"); sb.n.classList.remove("on"); });
        cont.appendChild(un.n);
      });
      bl.forEach(un => ajustar(un.n));
      if (desborda()) {
        bl.forEach(un => cont.removeChild(un.n));
        if (!puestas) pg.cu.removeChild(cont);
        if (pg.cu.children.length) pg = nueva();     // página nueva solo si la actual ya tiene algo
        cont = crearCont(sc, puestas > 0);
        pg.cu.appendChild(cont);
        bl.forEach(un => cont.appendChild(un.n));
        bl.forEach(un => ajustar(un.n));
      }
      puestas += bl.length;
      const pi = paginas.indexOf(pg);
      bl.forEach(un => {
        unidades.push({ u: un.n, cont, pag: pi, t: un.t, on: false });
        un.subs.forEach(sb => unidades.push({ u: sb.n, cont, pag: pi, t: sb.t, on: false }));
      });
    });
  });
  libro = { unidades, paginas, T: secs.T };
}

/* pone al día lo que se ve según s */
function aplicar(anim) {
  const U = libro.unidades;
  s = Math.max(0, Math.min(s, libro.T));
  const conts = new Map();
  U.forEach((o, i) => {
    const on = o.t <= s;
    if (on !== o.on) {
      o.on = on;
      if (on) { o.u.classList.remove("rapido"); o.u.classList.add("on"); }
      else { o.u.classList.add("rapido"); o.u.classList.remove("on"); }
    }
    if (on) conts.set(o.cont, true); else if (!conts.has(o.cont)) conts.set(o.cont, false);
  });
  conts.forEach((v, c) => {
    if (v) { c.classList.remove("rapido"); c.classList.add("on"); }
    else { c.classList.add("rapido"); c.classList.remove("on"); }
  });
  let p = 0;
  U.forEach(o => { if (o.t <= s) p = Math.max(p, o.pag); });
  const L = Math.max(p - 1, 0);
  const pista = $("pista");
  pista.classList.toggle("anim", !!anim);
  pista.style.transform = "translateX(" + (-L * G.Sw) + "px)";
  if (anim && L > Lprev) {
    const h = libro.paginas[p].hoja;
    h.classList.remove("gira"); void h.offsetWidth; h.classList.add("gira");
    setTimeout(() => h.classList.remove("gira"), 1000);
  }
  Lprev = L;
  const n = libro.T;
  $("contador").textContent = EJERCICIOS[actual].titulo + " · " + s + " / " + n;
  $("relleno").style.width = (n ? s / n * 100 : 0) + "%";
  $("btnAtras").disabled = (actual === 0 && s <= 1);
  $("btnAdelante").disabled = (actual === EJERCICIOS.length - 1 && s === n);
}

function pintarPestanas() {
  const nav = $("pestanas");
  nav.innerHTML = "";
  EJERCICIOS.forEach((e, i) => {
    const b = document.createElement("button");
    b.textContent = e.titulo.replace("Ejercicio ", "Ej. ");
    b.setAttribute("aria-selected", i === actual);
    b.onclick = ev => { ev.stopPropagation(); cargar(i, false); };
    nav.appendChild(b);
  });
  const sel = nav.querySelector('[aria-selected="true"]');
  if (sel) sel.scrollIntoView({ inline: "center", block: "nearest" });
}

function construir() {
  geometria();
  const e = EJERCICIOS[actual];
  const secs = extraer(e);
  paginar(secs, e._T);
}

async function cargar(i, alFinal) {
  const lib = $("libro");
  lib.classList.add("fuera");
  await new Promise(r => setTimeout(r, 200));
  actual = i;
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
  construir();
  s = alFinal ? libro.T : 1;          // al abrir un ejercicio ya se ve el enunciado
  Lprev = 0;
  pintarPestanas();
  aplicar(false);
  lib.classList.remove("fuera");
}

function avanzar() {
  if (s < libro.T) { s++; aplicar(true); }
  else if (actual < EJERCICIOS.length - 1) cargar(actual + 1, false);
}
function retroceder() {
  if (s > 1) { s--; aplicar(true); }
  else if (actual > 0) cargar(actual - 1, true);
}

/* clic: tercio izquierdo = atrás; resto = adelante */
$("libro").addEventListener("click", ev => {
  if (String(window.getSelection())) return;
  if (ev.clientX < window.innerWidth / 3) retroceder(); else avanzar();
});
$("btnAtras").onclick = ev => { ev.stopPropagation(); retroceder(); };
$("btnAdelante").onclick = ev => { ev.stopPropagation(); avanzar(); };
$("tira").onclick = ev => {
  ev.stopPropagation();
  const r = $("tira").getBoundingClientRect();
  s = Math.max(1, Math.round((ev.clientX - r.left) / r.width * libro.T));
  aplicar(true);
};
document.addEventListener("keydown", ev => {
  if (["ArrowRight", "PageDown", " ", "Enter"].includes(ev.key)) { ev.preventDefault(); avanzar(); }
  else if (["ArrowLeft", "PageUp", "Backspace"].includes(ev.key)) { ev.preventDefault(); retroceder(); }
  else if (ev.key === "Home") { s = 1; aplicar(true); }
  else if (ev.key === "End") { s = libro.T; aplicar(true); }
});
let tRes = null;
window.addEventListener("resize", () => {
  clearTimeout(tRes);
  tRes = setTimeout(() => { if (libro) { construir(); Lprev = 0; aplicar(false); } }, 150);
});

window.addEventListener("load", () => cargar(0, false));
</script>
