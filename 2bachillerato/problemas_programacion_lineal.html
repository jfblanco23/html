<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Programación lineal · problemas</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<style>
  :root{
    --texto:#111; --verde-fondo:#E5FFE5; --verde-borde:#80FF80; --verde-titulo:#5CD65C;
    --azul:#1414E6; --rojo:#E01E1E; --gris:#666;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;color:var(--texto);cursor:pointer;
    font-family:"Latin Modern Roman","CMU Serif","Computer Modern Serif","Palatino Linotype",Palatino,Georgia,serif;
    font-size:20px;line-height:1.55;-webkit-tap-highlight-color:transparent}

  html,body{overflow:hidden}
  body{background:#fff}

  /* barra superior */
  .barra-sup{position:fixed;top:0;left:0;right:0;height:46px;z-index:5;background:#fff;border-bottom:1px solid #ddd;
    padding:0 14px;display:flex;gap:14px;align-items:center;font-size:.85rem;color:var(--gris)}
  .barra-sup .tit{font-weight:bold;color:#333;white-space:nowrap}
  .barra-sup .ayuda{white-space:nowrap;font-size:.8rem;color:#888}
  @media (max-width:1100px){.barra-sup .ayuda{display:none}}
  .barra-sup .borrar{font:inherit;font-size:.8rem;padding:3px 10px;border-radius:8px;cursor:pointer;white-space:nowrap;
    background:#fff;border:1.5px solid #bbb;color:#555}
  .barra-sup .borrar:hover{border-color:#333;color:#333}
  .pestanas{display:flex;gap:6px;margin-left:auto;overflow-x:auto;scrollbar-width:none;padding:2px 0}
  .pestanas::-webkit-scrollbar{display:none}
  .pestanas button{font:inherit;font-size:.85rem;padding:3px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;
    background:#fff;border:1.5px solid #333;color:#333}
  .pestanas button[aria-selected="true"]{background:#333;color:#fff}

  /* barra inferior: botones grandes (pizarra digital) y progreso */
  .progreso{position:fixed;left:0;right:0;bottom:0;height:52px;z-index:5;background:#fff;border-top:1px solid #ddd;
    display:flex;align-items:center;gap:14px;padding:0 14px;font-size:.85rem;color:var(--gris)}
  .progreso .tira{flex:1;height:10px;background:#e8e8e8;border-radius:5px;overflow:hidden;cursor:pointer}
  .progreso .tira i{display:block;height:100%;background:#2e9e2e;transition:width .35s ease}
  .progreso .nav{font:inherit;font-size:1.5rem;line-height:1;width:64px;height:38px;border-radius:10px;cursor:pointer;
    background:#fff;border:2px solid #2e9e2e;color:#2e9e2e}
  .progreso .nav:active{background:#2e9e2e;color:#fff}
  .progreso .nav:disabled{opacity:.3;cursor:default}
  #contador{min-width:9.5em;text-align:right;white-space:nowrap}

  /* el libro: dos páginas, separadas solo por una línea fina */
  #libro{position:fixed;left:0;right:0;top:46px;bottom:52px;overflow:hidden;background:#fff;transition:opacity .25s ease}
  #libro.fuera{opacity:0}
  #pista{position:absolute;left:0;top:0;height:100%;will-change:transform}
  #pista.anim{transition:transform .9s cubic-bezier(.65,.05,.25,1)}
  .hoja{position:absolute;top:0;padding:6px 8px}
  .pag{position:relative;background:#fff;transform-origin:0 0;padding:30px 40px 0}
  .pag .cuerpo{display:flow-root;overflow:hidden}
  .pag .num{position:absolute;left:0;right:0;bottom:12px;text-align:center;color:#bbb;font-size:.8rem}
  #lomo{position:absolute;left:50%;top:14px;bottom:14px;width:0;border-left:1px solid #c9c9c9;pointer-events:none;z-index:2}
  .hoja.gira .pag{animation:gira .9s ease both}
  @keyframes gira{from{opacity:0}to{opacity:1}}
  @media (prefers-reduced-motion:reduce){#pista.anim{transition:none}.hoja.gira .pag{animation:none}}

  /* lo que se va escribiendo */
  .cont{opacity:0;transition:opacity .35s ease}
  .cont.on{opacity:1}
  .u{opacity:0;clip-path:inset(-40px 100% -40px -40px);transition:opacity .25s ease,clip-path .85s ease}
  span.u{display:block}
  .u.on{opacity:1;clip-path:inset(-40px -40px -40px -40px)}
  .u.rapido,.cont.rapido{transition:none}
  .cont.sigue{margin-top:0;padding-top:14px;border-top-left-radius:0;border-top-right-radius:0}
  h1{margin:0 0 6px;font-size:2.1rem;line-height:1.2}
  h4{margin:16px 0 6px;font-size:1.18rem}

  /* cajas verdes del modelo */
  .caja{position:relative;background:var(--verde-fondo);border:1.5px solid var(--verde-borde);
    border-radius:8px;padding:20px 20px 10px;margin:26px 0 14px}
  .caja>.titulo{position:absolute;top:-13px;left:12px;background:var(--verde-titulo);color:#fff;
    font-weight:bold;padding:1px 12px;border-radius:5px;font-size:.92rem}
  .caja.enunciado{color:var(--azul);margin-top:6px;padding-top:12px}
  .caja p{margin:.3em 0 .5em}
  .paso{margin:6px 0 10px}

  /* frases del enunciado: subrayador (al pasar el ratón; doble clic = se queda fijado) */
  .fr{border-radius:4px;padding:1px 1px;cursor:pointer;transition:background-color .15s ease;
    -webkit-user-select:none;user-select:none;touch-action:manipulation;
    -webkit-box-decoration-break:clone;box-decoration-break:clone}
  .fr.c1{--hl:#FFE066} .fr.c2{--hl:#9BE9A8} .fr.c3{--hl:#8FD3FF}
  .fr.c4{--hl:#FFA8D0} .fr.c5{--hl:#FFC47A} .fr.c6{--hl:#CDB4FF}
  .fr.hov,.fr.fija{background-color:var(--hl)}

  /* matrices con menores marcados en caja roja */
  .ec{display:flex;align-items:center;justify-content:center;gap:.5em;margin:.6em 0;flex-wrap:wrap}
  .mat{--w:2.5em;--h:1.7em;position:relative;display:inline-grid;
    grid-template-columns:repeat(var(--nc),var(--w));grid-auto-rows:var(--h);
    margin:1.1em .7em .2em;text-align:center}
  .mat .c{display:flex;align-items:center;justify-content:center;white-space:nowrap}
  .mat::before,.mat::after{content:"";position:absolute;top:-.15em;bottom:-.15em;width:.55em;border:2px solid #111}
  .mat::before{left:-.7em;border-right:0;border-radius:60% 0 0 60%/50% 0 0 50%}
  .mat::after{right:-.7em;border-left:0;border-radius:0 60% 60% 0/0 50% 50% 0}
  .mat .bar{position:absolute;top:.1em;bottom:.1em;left:calc(var(--k) * var(--w));border-left:1.5px solid #111}
  .nota{color:var(--gris);font-size:.9em}
  .origen{color:var(--gris);font-size:.78rem;margin:0 0 8px;line-height:1.3}
  .fig{margin:6px 0 4px}
  .fig svg{display:block;width:100%;height:auto}
  .fig.tres{display:flex;gap:6px}
  .fig.tres svg{width:33.33%}
  table.datos{border-collapse:collapse;margin:10px auto;font-size:1.02rem}
  table.datos th,table.datos td{border:1.5px solid #8a8a8a;padding:5px 16px;text-align:center}
  table.datos th{background:#f1f1f1}
  b.res{color:var(--rojo)}
  .katex-display{margin:.6em 0;overflow-x:auto;overflow-y:hidden}
</style>
</head>
<body>
<div class="barra-sup">
  <span class="tit">Programación lineal</span>
  <span class="ayuda">Pasa el ratón por el enunciado · doble clic para fijar el subrayado</span>
  <button class="borrar" id="btnBorrar" title="Quitar todos los subrayados fijados">Quitar subrayados</button>
  <nav class="pestanas" id="pestanas" aria-label="Problemas"></nav>
</div>
<div id="libro"><div id="pista"></div><div id="lomo"></div></div>
<div id="stage" style="position:absolute;left:-99999px;top:0;width:720px;visibility:hidden"></div>
<div class="progreso">
  <button class="nav" id="btnAtras" title="Retroceder (←)">‹</button>
  <button class="nav" id="btnAdelante" title="Avanzar (→)">›</button>
  <div class="tira" id="tira"><i id="relleno"></i></div>
  <span id="contador"></span>
</div>

<script>
/* ---------------------------------------------------------------------
   Matriz con barra opcional.
   rows: filas (cadenas LaTeX); opts.bar = nº de columnas antes de la barra;
   opts.w = ancho de columna en em
   --------------------------------------------------------------------- */
function mat(rows, opts = {}) {
  const nr = rows.length, nc = rows[0].length;
  const largo = Math.max(...rows.map(r => Math.max(...r.map(c => String(c).replace(/\\[a-zA-Z]+|[{}\s]/g, '').length))));
  const ancho = opts.w || Math.max(2.5, 1.0 + 0.55 * largo);
  let h = '<span class="mat" style="--nc:' + nc + ';--nr:' + nr + ';--w:' + ancho.toFixed(2) + 'em">';
  rows.forEach(r => r.forEach(c => { h += '<span class="c">$' + c + '$</span>'; }));
  if (opts.bar != null) h += '<span class="bar" style="--k:' + opts.bar + '"></span>';
  return h + '</span>';
}
const ec = (...partes) => '<div class="ec">' + partes.join('') + '</div>';
const ecp = (...partes) => '<div class="ec" style="font-size:.85em">' + partes.join('') + '</div>';   // algo más pequeño
const f = s => '<span>$' + s + '$</span>';


/* ---------------------------------------------------------------------
   Frases del enunciado y ecuaciones con el mismo color
   fr(k, texto): frase que se subraya (las frases con el mismo k forman un grupo)
   ce(k, tex):   la ecuación que sale de esa frase, con el mismo color de fondo
   --------------------------------------------------------------------- */
const HL = ['', '#FFE066', '#9BE9A8', '#8FD3FF', '#FFA8D0', '#FFC47A', '#CDB4FF'];
const fr = (k, t) => '<span class="fr c' + k + '" data-g="' + k + '">' + t + '</span>';
const ce = (k, tex) => '\\colorbox{' + HL[k] + '}{$\\,' + tex + '\\,$}';
const sis = filas => '$$\\left\\{\\begin{array}{l}' + filas.join('\\\\[2mm]') + '\\end{array}\\right.$$';

/* =====================================================================
   FIGURAS (SVG generado a partir de los mismos datos que los cálculos)
   grafico(P, C): P = datos del problema, C = capas que se ven en este paso
   ===================================================================== */
let _gid = 0;
const fmt = n => String(+(+n).toFixed(2)).replace('.', ',');
const LIN = ['', '#B88A00', '#1E9E3A', '#1478C8', '#D6357F', '#D9740A', '#7A4FD6'];   // mismo orden que HL, más oscuros para trazar

/* se queda con el semiplano a·x + b·y (op) c */
function recorta(poly, a, b, op, c) {
  const val = p => { const v = a * p[0] + b * p[1] - c; return op === '<=' ? -v : v; };
  const out = [];
  for (let i = 0; i < poly.length; i++) {
    const p = poly[i], q = poly[(i + 1) % poly.length], vp = val(p), vq = val(q);
    if (vp >= -1e-9) out.push(p);
    if ((vp > 1e-9 && vq < -1e-9) || (vp < -1e-9 && vq > 1e-9)) {
      const t = vp / (vp - vq);
      out.push([p[0] + t * (q[0] - p[0]), p[1] + t * (q[1] - p[1])]);
    }
  }
  return out;
}
/* trozo de la recta a·x + b·y = c que cae dentro de la ventana */
function segmento(a, b, c, x0, y0, x1, y1) {
  const pts = [];
  const add = (x, y) => {
    if (x >= x0 - 1e-9 && x <= x1 + 1e-9 && y >= y0 - 1e-9 && y <= y1 + 1e-9 &&
        !pts.some(p => Math.abs(p[0] - x) < 1e-6 && Math.abs(p[1] - y) < 1e-6)) pts.push([x, y]);
  };
  if (Math.abs(b) > 1e-12) { add(x0, (c - a * x0) / b); add(x1, (c - a * x1) / b); }
  if (Math.abs(a) > 1e-12) { add((c - b * y0) / a, y0); add((c - b * y1) / a, y1); }
  return pts.slice(0, 2);
}

function grafico(P, C = {}) {
  const id = 'g' + (++_gid);
  const [x0, x1, y0, y1, mx, my, px, py] = C.ventana ||
    [P.xmin || 0, P.xmax, P.ymin || 0, P.ymax, P.mx || P.px, P.my || P.py, P.px, P.py];
  const W = P.W || 720, H = P.H || 330, L = P.L || 46, R = 16, T = 22, B = 36;
  const sx = (W - L - R) / (x1 - x0), sy = (H - T - B) / (y1 - y0);
  const X = x => L + (x - x0) * sx, Y = y => H - B - (y - y0) * sy;
  const n = v => v.toFixed(1);
  const halo = 'stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"';
  let s = '<defs><clipPath id="' + id + '"><rect x="' + L + '" y="' + T + '" width="' + (W - L - R) + '" height="' + (H - T - B) + '"/></clipPath></defs>';

  /* cuadrícula, ejes y números */
  for (let i = Math.ceil(x0 / mx - 1e-9); i * mx <= x1 + 1e-9; i++) {
    const v = i * mx, mayor = Math.abs(v / px - Math.round(v / px)) < 1e-9;
    s += '<line x1="' + n(X(v)) + '" y1="' + T + '" x2="' + n(X(v)) + '" y2="' + (H - B) + '" stroke="' + (mayor ? '#d4d4d4' : '#ececec') + '" stroke-width="1"/>';
    if (mayor) s += '<text x="' + n(X(v)) + '" y="' + (H - B + 18) + '" text-anchor="middle" font-size="14" fill="#444">' + fmt(v) + '</text>';
  }
  for (let i = Math.ceil(y0 / my - 1e-9); i * my <= y1 + 1e-9; i++) {
    const v = i * my, mayor = Math.abs(v / py - Math.round(v / py)) < 1e-9;
    s += '<line x1="' + L + '" y1="' + n(Y(v)) + '" x2="' + (W - R) + '" y2="' + n(Y(v)) + '" stroke="' + (mayor ? '#d4d4d4' : '#ececec') + '" stroke-width="1"/>';
    if (mayor) s += '<text x="' + (L - 8) + '" y="' + n(Y(v) + 5) + '" text-anchor="end" font-size="14" fill="#444">' + fmt(v) + '</text>';
  }
  s = s.replace('</defs>', '</defs><rect x="' + L + '" y="' + T + '" width="' + (W - L - R) + '" height="' + (H - T - B) + '" fill="#fff"/>');
  s += '<rect x="' + L + '" y="' + T + '" width="' + (W - L - R) + '" height="' + (H - T - B) + '" fill="none" stroke="#bbb"/>';
  if (x0 === 0) s += '<line x1="' + L + '" y1="' + T + '" x2="' + L + '" y2="' + (H - B) + '" stroke="#111" stroke-width="2.4"/>';
  if (y0 === 0) s += '<line x1="' + L + '" y1="' + (H - B) + '" x2="' + (W - R) + '" y2="' + (H - B) + '" stroke="#111" stroke-width="2.4"/>';
  s += '<text x="' + (W - R) + '" y="' + (H - 6) + '" text-anchor="end" font-size="17" font-style="italic" fill="#111">' + (P.lx || 'x') + '</text>';
  s += '<text x="' + L + '" y="' + (T - 6) + '" text-anchor="middle" font-size="17" font-style="italic" fill="#111">' + (P.ly || 'y') + '</text>';

  /* región factible (se calcula recortando la ventana con cada restricción) */
  s += '<g clip-path="url(#' + id + ')">';
  if (C.region) {
    let poly = [[x0, y0], [x1, y0], [x1, y1], [x0, y1]];
    P.restr.forEach(r => { poly = recorta(poly, r.a, r.b, r.op, r.c); });
    s += '<polygon points="' + poly.map(p => n(X(p[0])) + ',' + n(Y(p[1]))).join(' ') + '" fill="' + (C.regionColor || 'rgba(20,20,230,.22)') + '" stroke="none"/>';
  }
  /* rectas */
  (C.rectas || []).forEach(i => {
    const r = P.restr[i], sg = segmento(r.a, r.b, r.c, x0, y0, x1, y1);
    if (sg.length === 2) s += '<line x1="' + n(X(sg[0][0])) + '" y1="' + n(Y(sg[0][1])) + '" x2="' + n(X(sg[1][0])) + '" y2="' + n(Y(sg[1][1])) +
      '" stroke="' + (C.color === false ? '#333' : LIN[r.k]) + '" stroke-width="2.6" stroke-linecap="round"/>';
  });
  /* rectas de nivel de la función objetivo */
  (C.nivel || []).forEach(l => {
    const sg = segmento(l.a, l.b, l.c, x0, y0, x1, y1);
    if (sg.length === 2) s += '<line x1="' + n(X(sg[0][0])) + '" y1="' + n(Y(sg[0][1])) + '" x2="' + n(X(sg[1][0])) + '" y2="' + n(Y(sg[1][1])) +
      '" stroke="#E01E1E" stroke-width="2.4" stroke-dasharray="9 6"/>';
  });
  s += '</g>';
  /* etiquetas de las rectas */
  if (C.etiquetas) (C.rectas || []).forEach(i => {
    const r = P.restr[i], p = (C.zoom && r.lp2) ? r.lp2 : r.lp, anc = (C.zoom && r.anc2) ? r.anc2 : (r.anc || 'start');
    if (p) s += '<text x="' + n(X(p[0])) + '" y="' + n(Y(p[1])) + '" text-anchor="' + anc + '" font-size="16" font-weight="bold" ' + halo +
      ' fill="' + (C.color === false ? '#222' : LIN[r.k]) + '">' + r.lab + '</text>';
  });
  (C.nivel || []).forEach(l => {
    if (l.lp) s += '<text x="' + n(X(l.lp[0])) + '" y="' + n(Y(l.lp[1])) + '" text-anchor="' + (l.anc || 'start') + '" font-size="16" font-weight="bold" ' + halo + ' fill="#E01E1E">' + l.lab + '</text>';
  });
  /* puntos sueltos, enteros y vértices */
  (C.puntos || []).forEach(q => {
    const cx = X(q.p[0]), cy = Y(q.p[1]);
    if (q.ok === false) s += '<g stroke="#E01E1E" stroke-width="3.4" stroke-linecap="round"><line x1="' + n(cx - 6) + '" y1="' + n(cy - 6) + '" x2="' + n(cx + 6) + '" y2="' + n(cy + 6) + '"/><line x1="' + n(cx - 6) + '" y1="' + n(cy + 6) + '" x2="' + n(cx + 6) + '" y2="' + n(cy - 6) + '"/></g>';
    else s += '<circle cx="' + n(cx) + '" cy="' + n(cy) + '" r="6" fill="#2e9e2e" stroke="#fff" stroke-width="2"/>';
    if (q.lab) s += '<text x="' + n(cx + (q.dx || 0)) + '" y="' + n(cy + (q.dy || 0)) + '" text-anchor="' + (q.anc || 'start') + '" font-size="16" font-weight="bold" ' + halo + ' fill="' + (q.ok === false ? '#E01E1E' : '#1d7a1d') + '">' + q.lab + '</text>';
  });
  (C.enteros || []).forEach(q => {
    s += '<circle cx="' + n(X(q.p[0])) + '" cy="' + n(Y(q.p[1])) + '" r="5.5" fill="#E01E1E" stroke="#fff" stroke-width="1.8"/>';
    if (q.lab) s += '<text x="' + n(X(q.p[0]) + (q.dx || 0)) + '" y="' + n(Y(q.p[1]) + (q.dy || 0)) + '" text-anchor="' + (q.anc || 'start') + '" font-size="15" font-weight="bold" ' + halo + ' fill="#B01010">' + q.lab + '</text>';
  });
  (C.vertices || []).forEach(v => {
    s += '<circle cx="' + n(X(v.p[0])) + '" cy="' + n(Y(v.p[1])) + '" r="5" fill="#111" stroke="#fff" stroke-width="1.6"/>';
    s += '<text x="' + n(X(v.p[0]) + (v.dx || 0)) + '" y="' + n(Y(v.p[1]) + (v.dy || 0)) + '" text-anchor="' + (v.anc || 'start') + '" font-size="16" font-weight="bold" ' + halo + ' fill="#111">' + v.lab + '</text>';
  });
  if (C.titulo) s += '<text x="' + (L + 8) + '" y="' + (T + 20) + '" font-size="17" font-weight="bold" fill="#111">' + C.titulo + '</text>';
  const svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" xmlns="http://www.w3.org/2000/svg">' + s + '</svg>';
  return C.soloSvg ? svg : '<div class="fig">' + svg + '</div>';
}

/* =====================================================================
   DATOS DE LAS FIGURAS
   ===================================================================== */
/* Convoy (CyL Modelo 0): x = camiones de agua, y = camiones de medicinas */
const PC = { xmax: 30, ymax: 30, px: 5, py: 5, mx: 1, my: 5, restr: [
  { a: 1, b: 1,  op: '<=', c: 27, k: 1, lab: 'x + y = 27', lp: [2.4, 26.6] },
  { a: 1, b: 0,  op: '>=', c: 12, k: 2, lab: 'x = 12',     lp: [12.4, 28.6] },
  { a: -1, b: 2, op: '>=', c: 0,  k: 3, lab: 'y = x/2',    lp: [29.6, 17.2], anc: 'end' }
]};

/* Revisiones (CyL Julio 2026, 1.2): x = normales, y = exhaustivas */
const P12 = { xmax: 75, ymax: 50, px: 10, py: 5, mx: 5, my: 5, H: 300, restr: [
  { a: 0, b: 1,    op: '>=', c: 7,   k: 2, lab: 'y = 7',          lp: [2.5, 8.8],  lp2: [48.15, 6.45] },
  { a: 2, b: -5,   op: '>=', c: 5,   k: 3, lab: '2x − 5y = 5',    lp: [53, 27.8],  lp2: [48.2, 13.5] },
  { a: 3, b: 6,    op: '<=', c: 220, k: 4, lab: '3x + 6y = 220',  lp: [3, 39.4],   lp2: [54.5, 10.1] },
  { a: 4, b: 3,    op: '<=', c: 240, k: 5, lab: '2x + 1,5y = 120', lp: [29.5, 44.6], lp2: [50.35, 13.35] }
]};
const ZOOM12 = [48, 57, 6, 14, 1, 1, 1, 2];

/* =====================================================================
   PROBLEMAS
   ===================================================================== */
const VERT12 = [
  { p: [20, 7],          lab: 'A(20, 7)',          dx: 10, dy: 21 },
  { p: [1130 / 27, 425 / 27], lab: 'B(41,85; 15,74)', dx: 0, dy: -20, anc: 'middle' },

/* =====================================================================
   GENERADOR DE PASOS PARA UN PROBLEMA DE PROGRAMACIÓN LINEAL
   A partir de los mismos datos (restricciones, función objetivo) se
   calculan vértices, valores, figuras y comprobación, de modo que
   dibujo y números no pueden contradecirse.
   ===================================================================== */
const _mcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a; };
const _mcm = (a, b) => a / _mcd(a, b) * b;

class Fr {
  constructor(n, d = 1) { if (d < 0) { n = -n; d = -d; } const g = _mcd(n, d) || 1; this.n = n / g; this.d = d / g; }
  static of(x) {
    if (x instanceof Fr) return x;
    if (Number.isInteger(x)) return new Fr(x, 1);
    let d = 1; while (!Number.isInteger(+(x * d).toFixed(6)) && d < 1e6) d *= 10;
    return new Fr(Math.round(x * d), d);
  }
  add(o) { o = Fr.of(o); return new Fr(this.n * o.d + o.n * this.d, this.d * o.d); }
  sub(o) { o = Fr.of(o); return new Fr(this.n * o.d - o.n * this.d, this.d * o.d); }
  mul(o) { o = Fr.of(o); return new Fr(this.n * o.n, this.d * o.d); }
  div(o) { o = Fr.of(o); return new Fr(this.n * o.d, this.d * o.n); }
  neg() { return new Fr(-this.n, this.d); }
  val() { return this.n / this.d; }
  isInt() { return this.d === 1; }
  eq(o) { o = Fr.of(o); return this.n === o.n && this.d === o.d; }
  cmp(o) { return this.sub(o).n; }
}

/* número en LaTeX: entero, decimal exacto con coma o fracción */
function tx(q) {
  q = Fr.of(q);
  if (q.d === 1) return String(q.n);
  let d = q.d; while (d % 2 === 0) d /= 2; while (d % 5 === 0) d /= 5;
  if (d === 1) return String(+q.val().toFixed(6)).replace('.', '{,}');
  return (q.n < 0 ? '-' : '') + '\\dfrac{' + Math.abs(q.n) + '}{' + q.d + '}';
}
const _aprox = q => String(+Fr.of(q).val().toFixed(2)).replace('.', '{,}');
const _terminaEnDecimal = q => { q = Fr.of(q); let d = q.d; while (d % 2 === 0) d /= 2; while (d % 5 === 0) d /= 5; return d === 1; };
/* número con aproximación si es una fracción que no termina */
const txa = q => (_terminaEnDecimal(q) ? tx(q) : tx(q) + '\\approx' + _aprox(q));
/* en texto plano (no LaTeX), con coma decimal */
const txt = q => { q = Fr.of(q); return String(+q.val().toFixed(2)).replace('.', ','); };
/* número grande con espacio fino de miles, para frases */
const miles = n => { const s = String(Math.round(Math.abs(n))); const g = s.replace(/\B(?=(\d{3})+(?!\d))/g, '\u00A0'); return (n < 0 ? '−' : '') + g; };

/* a·x + b·y con los nombres de variable vn */
function lin(a, b, vn = ['x', 'y']) {
  let s = '';
  [[a, vn[0]], [b, vn[1]]].forEach(([k, v]) => {
    k = Fr.of(k); if (k.n === 0) return;
    const neg = k.n < 0, ab = neg ? k.neg() : k;
    const t = ab.eq(1) ? v : tx(ab) + v;
    s += (s === '' ? (neg ? '-' : '') : (neg ? '-' : '+')) + t;
  });
  return s || '0';
}
/* la misma expresión con números sustituidos: 3·20+3·30 */
function exprNum(a, b, xv, yv) {
  const par = v => (Fr.of(v).isInt() ? tx(v) : '\\left(' + tx(v) + '\\right)');
  const ts = [];
  [[a, xv], [b, yv]].forEach(([k, v]) => {
    k = Fr.of(k); if (k.n === 0) return;
    if (k.eq(1)) ts.push(par(v));
    else if (k.eq(-1)) ts.push('-' + par(v));
    else ts.push(tx(k) + '\\cdot' + par(v));
  });
  return ts.reduce((s, t, i) => (i === 0 ? t : s + (t[0] === '-' ? '' : '+') + t), '') || '0';
}
const _punto = (x, y) => '(' + tx(x) + ',\\,' + tx(y) + ')';
const _nom = (n, x, y) => n + '\\left(' + tx(x) + ',\\,' + tx(y) + '\\right)';
const _nomc = (n, x, y) => (Fr.of(x).isInt() && Fr.of(y).isInt() ? n + _punto(x, y) : _nom(n, x, y));

/* ---------- resolver el sistema de dos rectas con su explicación ---------- */
/* r = {a,b,c} (Fr), r.eqh = ecuación coloreada (HTML/LaTeX para sis) */
function _resolver(r1, r2, nombre, vn) {
  const [X, Y] = vn;
  const a1 = r1.a, b1 = r1.b, c1 = r1.c, a2 = r2.a, b2 = r2.b, c2 = r2.c;
  let x, y, html = '';
  /* dos rectas paralelas a los ejes, o el origen */
  if (c1.n === 0 && c2.n === 0) {
    x = new Fr(0); y = new Fr(0);
    return { x, y, html: '<p>' + (r1.eje && r2.eje ? 'Los dos ejes se cortan en el origen:' : 'Las dos rectas pasan por el origen:') + '</p>$$' + nombre + '(0,\\,0)$$' };
  }
  const vert1 = b1.n === 0, vert2 = b2.n === 0, hor1 = a1.n === 0, hor2 = a2.n === 0;
  if ((vert1 || vert2) && (hor1 || hor2)) {
    const v = vert1 ? r1 : r2, h = hor1 ? r1 : r2;
    x = v.c.div(v.a); y = h.c.div(h.b);
    return { x, y, html: '$$' + X + '=' + tx(x) + ',\\quad ' + Y + '=' + tx(y) + '\\quad\\Rightarrow\\quad ' + _nomc(nombre, x, y) + '$$' };
  }
  if (vert1 || vert2) {                       // una vertical: se sustituye x
    const v = vert1 ? r1 : r2, o = vert1 ? r2 : r1;
    x = v.c.div(v.a);
    const rhs = o.c.sub(o.a.mul(x));
    y = rhs.div(o.b);
    const izq = (o.a.n === 0 ? '' : exprNum(o.a, 0, x, 0) + (o.b.n < 0 ? '' : '+')) + lin(0, o.b, vn);
    html = '<p>Sustituimos $' + X + '=' + tx(x) + '$ en la otra ecuación:</p>$$' + izq + '=' + tx(o.c) +
      (o.b.eq(1) ? '' : '\\;\\Rightarrow\\;' + lin(0, o.b, vn) + '=' + tx(rhs)) +
      '\\;\\Rightarrow\\;' + Y + '=' + tx(y) + '\\quad\\Rightarrow\\quad ' + _nomc(nombre, x, y) + '$$';
    return { x, y, html };
  }
  if (hor1 || hor2) {                         // una horizontal: se sustituye y
    const h = hor1 ? r1 : r2, o = hor1 ? r2 : r1;
    y = h.c.div(h.b);
    const rhs = o.c.sub(o.b.mul(y));
    x = rhs.div(o.a);
    const izq = lin(o.a, 0, vn) + (o.b.n === 0 ? '' : (o.b.n < 0 ? '' : '+') + exprNum(0, o.b, 0, y));
    html = '<p>Sustituimos $' + Y + '=' + tx(y) + '$ en la otra ecuación:</p>$$' + izq + '=' + tx(o.c) +
      (o.a.eq(1) ? '' : '\\;\\Rightarrow\\;' + lin(o.a, 0, vn) + '=' + tx(rhs)) +
      '\\;\\Rightarrow\\;' + X + '=' + tx(x) + '\\quad\\Rightarrow\\quad ' + _nomc(nombre, x, y) + '$$';
    return { x, y, html };
  }
  /* general: reducción. Se pasan a coeficientes enteros */
  const ent = r => { const m = [r.a, r.b, r.c].reduce((s, q) => _mcm(s, q.d), 1); return [r.a.mul(m), r.b.mul(m), r.c.mul(m)]; };
  const [A1, B1, C1] = ent(r1), [A2, B2, C2] = ent(r2);
  const mY = [_mcm(Math.abs(B1.n), Math.abs(B2.n)) / Math.abs(B1.n), _mcm(Math.abs(B1.n), Math.abs(B2.n)) / Math.abs(B2.n)];
  const mX = [_mcm(Math.abs(A1.n), Math.abs(A2.n)) / Math.abs(A1.n), _mcm(Math.abs(A1.n), Math.abs(A2.n)) / Math.abs(A2.n)];
  const quitaY = (mY[0] + mY[1]) <= (mX[0] + mX[1]);
  const m = quitaY ? mY : mX;
  const e1 = [A1.mul(m[0]), B1.mul(m[0]), C1.mul(m[0])], e2 = [A2.mul(m[1]), B2.mul(m[1]), C2.mul(m[1])];
  const k = quitaY ? 1 : 0;                   // índice de la variable que se elimina
  const igual = e1[k].n === e2[k].n;          // mismo signo: se resta; si no, se suma
  const res = igual ? [e1[0].sub(e2[0]), e1[1].sub(e2[1]), e1[2].sub(e2[2])] : [e1[0].add(e2[0]), e1[1].add(e2[1]), e1[2].add(e2[2])];
  const vq = quitaY ? X : Y, vo = quitaY ? Y : X;
  const queda = quitaY ? res[0] : res[1];
  const sol = res[2].div(queda);
  if (quitaY) x = sol; else y = sol;
  const mult = (n, ord) => (n === 1 ? 'la ' + ord + ' se queda igual' : 'la ' + ord + ' por $' + n + '$');
  const oper = igual ? 'restamos' : 'sumamos';
  const frase = (m[0] === 1 && m[1] === 1)
    ? 'el coeficiente de $' + vo + '$ ' + (igual ? 'es el mismo en las dos ecuaciones' : 'es opuesto en las dos ecuaciones') + ', así que ' + oper
    : (m[0] === 1 ? 'dejamos la primera igual y multiplicamos la segunda por $' + m[1] + '$'
      : m[1] === 1 ? 'multiplicamos la primera por $' + m[0] + '$ y dejamos la segunda igual'
      : 'multiplicamos la primera por $' + m[0] + '$ y la segunda por $' + m[1] + '$') + ' para igualar el coeficiente de $' + vo + '$, y ' + oper;
  html = '<p>Reducción: ' + frase + ':</p>$$\\begin{array}{r}' +
    lin(e1[0], e1[1], vn) + '=' + tx(e1[2]) + '\\\\ ' + lin(e2[0], e2[1], vn) + '=' + tx(e2[2]) + '\\\\\\hline ' +
    (quitaY ? lin(res[0], 0, vn) : lin(0, res[1], vn)) + '=' + tx(res[2]) + '\\end{array}\\quad\\Rightarrow\\quad ' + vq + '=' + txa(sol) + '$$';
  /* la otra variable, sustituyendo en la primera ecuación (sin escalar) */
  if (quitaY) {
    const rhs = c1.sub(a1.mul(x)); y = rhs.div(b1);
    html += '<p>Sustituimos en la primera ecuación:</p>$$' + exprNum(a1, 0, x, 0) + (b1.n < 0 ? '' : '+') + lin(0, b1, vn) + '=' + tx(c1) +
      (b1.eq(1) ? '' : '\\;\\Rightarrow\\;' + lin(0, b1, vn) + '=' + tx(rhs)) + '\\;\\Rightarrow\\;' + Y + '=' + txa(y) + '$$';
  } else {
    const rhs = c1.sub(b1.mul(y)); x = rhs.div(a1);
    html += '<p>Sustituimos en la primera ecuación:</p>$$' + lin(a1, 0, vn) + (b1.n < 0 ? '' : '+') + exprNum(0, b1, 0, y) + '=' + tx(c1) +
      (a1.eq(1) ? '' : '\\;\\Rightarrow\\;' + lin(a1, 0, vn) + '=' + tx(rhs)) + '\\;\\Rightarrow\\;' + X + '=' + txa(x) + '$$';
  }
  html += '$$' + (Fr.of(x).isInt() && Fr.of(y).isInt() ? nombre + _punto(x, y) : nombre + '\\left(' + tx(x) + ',\\,' + tx(y) + '\\right)') + '$$';
  return { x, y, html };
}

/* ---------- vértices de la región ---------- */
function _vertices(restr) {
  const L = restr.map(r => ({ a: Fr.of(r.a), b: Fr.of(r.b), c: Fr.of(r.c), op: r.op, i: r.i }));
  L.push({ a: new Fr(1), b: new Fr(0), c: new Fr(0), op: '>=', i: 'x0' });
  L.push({ a: new Fr(0), b: new Fr(1), c: new Fr(0), op: '>=', i: 'y0' });
  const ok = (x, y) => L.every(l => { const v = l.a.mul(x).add(l.b.mul(y)).sub(l.c); return l.op === '<=' ? v.n <= 0 : v.n >= 0; });
  const V = [];
  for (let i = 0; i < L.length; i++) for (let j = i + 1; j < L.length; j++) {
    const det = L[i].a.mul(L[j].b).sub(L[j].a.mul(L[i].b));
    if (det.n === 0) continue;
    const x = L[i].c.mul(L[j].b).sub(L[j].c.mul(L[i].b)).div(det);
    const y = L[i].a.mul(L[j].c).sub(L[j].a.mul(L[i].c)).div(det);
    if (!ok(x, y)) continue;
    let v = V.find(w => w.x.eq(x) && w.y.eq(y));
    if (!v) { v = { x, y, act: new Set() }; V.push(v); }
    v.act.add(i); v.act.add(j);
  }
  /* todas las rectas que pasan por el vértice */
  V.forEach(v => { v.act = L.map((l, i) => i).filter(i => l_pasa(L[i], v)); });
  function l_pasa(l, v) { return l.a.mul(v.x).add(l.b.mul(v.y)).eq(l.c); }
  return { V, L };
}
/* orden: en sentido horario empezando por el más a la izquierda (y, de ellos, el más bajo) */
function _ordenar(V) {
  const cx = V.reduce((s, v) => s + v.x.val(), 0) / V.length, cy = V.reduce((s, v) => s + v.y.val(), 0) / V.length;
  const ang = v => Math.atan2(v.y.val() - cy, v.x.val() - cx);
  const ini = V.slice().sort((p, q) => (p.x.val() - q.x.val()) || (p.y.val() - q.y.val()))[0];
  const rest = V.filter(v => v !== ini).sort((p, q) => ang(q) - ang(p));      // horario
  /* el horario desde el inicial: ángulos decrecientes a partir del ángulo del inicial */
  const a0 = ang(ini);
  const norm = a => { let d = a0 - a; while (d < 0) d += 2 * Math.PI; while (d >= 2 * Math.PI) d -= 2 * Math.PI; return d; };
  return [ini].concat(V.filter(v => v !== ini).sort((p, q) => norm(ang(p)) - norm(ang(q))));
}

/* ---------- puntos para dibujar una recta ---------- */
function _dosPuntos(r, fig) {
  if (r.pts) return r.pts;
  const a = Fr.of(r.a), b = Fr.of(r.b), c = Fr.of(r.c), xm = fig.xmax, ym = fig.ymax;
  if (b.n === 0) { const v = c.div(a); return [[v, 0], [v, ym]]; }
  if (a.n === 0) { const v = c.div(b); return [[0, v], [xm, v]]; }
  if (c.n !== 0) {
    const ix = c.div(a), iy = c.div(b);
    if (ix.isInt() && iy.isInt() && ix.val() > 0 && iy.val() > 0 && ix.val() <= xm && iy.val() <= ym) return [[0, iy], [ix, 0]];
  }
  /* puntos enteros dentro de la ventana, sobre la malla "grande" si se puede */
  const cand = [];
  for (let x = 0; x <= xm; x += (fig.mx || 1)) {
    const y = c.sub(a.mul(x)).div(b);
    if (y.isInt() && y.val() >= 0 && y.val() <= ym) cand.push([x, y.n]);
  }
  if (cand.length >= 2) return [cand[0], cand[cand.length - 1]];
  return [[0, c.div(b)], [c.div(a), 0]];
}

/* posiciones por defecto de las etiquetas de las rectas */
function _ctx(P) {
  const W = P.W || 720, H = P.H || 330, L = P.L || 46, R = 16, T = 22, B = 36;
  const x0 = P.xmin || 0, y0 = P.ymin || 0, x1 = P.xmax, y1 = P.ymax;
  const sx = (W - L - R) / (x1 - x0), sy = (H - T - B) / (y1 - y0);
  const X = x => L + (x - x0) * sx, Y = y => H - B - (y - y0) * sy;
  const inv = (px, py) => [x0 + (px - L) / sx, y0 + (H - B - py) / sy];
  const segs = P.restr.map(r => {
    const sg = segmento(r.a, r.b, r.c, x0, y0, x1, y1);
    return sg.length === 2 ? [[X(sg[0][0]), Y(sg[0][1])], [X(sg[1][0]), Y(sg[1][1])]] : null;
  });
  const caja = (px, py, anc, w) => { const xa = anc === 'start' ? px : anc === 'end' ? px - w : px - w / 2; return [xa, py - 14, xa + w, py + 4]; };
  const toca = (sg, bb) => {
    if (!sg) return false;
    for (let k = 0; k <= 30; k++) {
      const x = sg[0][0] + (sg[1][0] - sg[0][0]) * k / 30, y = sg[0][1] + (sg[1][1] - sg[0][1]) * k / 30;
      if (x >= bb[0] - 2 && x <= bb[2] + 2 && y >= bb[1] - 2 && y <= bb[3] + 2) return true;
    }
    return false;
  };
  const solapa = (a, b) => !(a[2] + 3 < b[0] || b[2] + 3 < a[0] || a[3] + 3 < b[1] || b[3] + 3 < a[1]);
  const fuera = bb => bb[0] < L + 2 || bb[2] > W - R - 2 || bb[1] < T + 2 || bb[3] > H - B - 2;
  return { W, H, L, R, T, B, X, Y, inv, segs, caja, toca, solapa, fuera };
}

function _autoLP(P) {
  const k = _ctx(P), { X, Y, inv, segs, caja, toca, solapa, fuera } = k;
  const ancho = r => 9.4 * r.lab.length + 4;
  const puestas = [];
  P.restr.forEach(r => { if (r.lp) puestas.push(caja(X(r.lp[0]), Y(r.lp[1]), r.anc || 'start', ancho(r))); });
  P.restr.forEach((r, i) => {
    if (r.lp || !segs[i]) return;
    let [p, q] = segs[i]; if (p[0] > q[0]) [p, q] = [q, p];
    const w = ancho(r), cands = [];
    const vert = Math.abs(p[0] - q[0]) < 1e-6, hor = Math.abs(p[1] - q[1]) < 1e-6;
    for (let t = .06; t <= .94; t += .04) {
      const bx = p[0] + t * (q[0] - p[0]), by = p[1] + t * (q[1] - p[1]);
      if (vert) { const py = Math.min(p[1], q[1]) + t * Math.abs(q[1] - p[1]); cands.push([bx + 7, py, 'start', t], [bx - 7, py, 'end', t]); }
      else {
        cands.push([bx + 6, by - 8, 'start', t], [bx - 6, by - 8, 'end', t], [bx + 6, by + 19, 'start', t], [bx - 6, by + 19, 'end', t]);
        if (hor) cands.push([bx, by - 8, 'middle', t]);
      }
    }
    let best = null, bs = 1e9;
    cands.forEach(([px, py, anc, t], n) => {
      const bb = caja(px, py, anc, w);
      let sc = 0;
      if (fuera(bb)) sc += 100;
      segs.forEach((sg, j) => { if (j !== i && toca(sg, bb)) sc += 14; });
      if (toca(segs[i], bb)) sc += 16;
      puestas.forEach(pb => { if (solapa(bb, pb)) sc += 14; });
      sc += Math.abs(t - .3) * 2 + n * 0.001;
      if (sc < bs) { bs = sc; best = [px, py, anc]; }
    });
    puestas.push(caja(best[0], best[1], best[2], w));
    r.lp = inv(best[0], best[1]); r.anc = best[2];
  });
  P._puestas = puestas;
}

/* etiquetas de vértices: se prueba alrededor de cada punto y se elige la posición sin choques */
function _autoVert(P, etV) {
  const k = _ctx(P), { X, Y, segs, caja, toca, solapa, fuera } = k;
  const puestas = (P._puestas || []).slice();
  etV.forEach(e => { if (e.fijo) puestas.push(caja(X(e.p[0]) + e.dx, Y(e.p[1]) + e.dy, e.anc, 9.4 * e.lab.length)); });
  etV.forEach(e => {
    if (e.fijo) return;
    const w = 9.4 * e.lab.length, px = X(e.p[0]), py = Y(e.p[1]);
    const cands = [[12, -9, 'start'], [12, 21, 'start'], [-12, -9, 'end'], [-12, 21, 'end'], [0, -14, 'middle'], [0, 26, 'middle'], [14, 6, 'start'], [-14, 6, 'end'], [16, -22, 'start'], [-16, -22, 'end'], [16, 34, 'start'], [-16, 34, 'end'], [0, -26, 'middle'], [0, 40, 'middle']];
    let best = null, bs = 1e9;
    cands.forEach(([dx, dy, anc], n) => {
      const bb = caja(px + dx, py + dy, anc, w);
      let sc = n * .01;
      if (fuera(bb)) sc += 100;
      segs.forEach(sg => { if (toca(sg, bb)) sc += 8; });
      puestas.forEach(pb => { if (solapa(bb, pb)) sc += 25; });
      if (sc < bs) { bs = sc; best = [dx, dy, anc]; }
    });
    e.dx = best[0]; e.dy = best[1]; e.anc = best[2];
    puestas.push(caja(px + e.dx, py + e.dy, e.anc, w));
  });
}

/* ---------- el generador ---------- */
function pasosPL(c) {
  const vn = c.vn || ['x', 'y'], [X, Y] = vn;
  const mx = c.sentido === 'max';
  const N = c.Fn || 'F';
  const fa = Fr.of(c.F.a), fb = Fr.of(c.F.b);
  c.restr.forEach((r, i) => { r.i = i; r.a = Fr.of(r.a).val(); r.b = Fr.of(r.b).val(); r.c = Fr.of(r.c).val(); });
  const P = Object.assign({ lx: vn[0].replace('_1', '₁').replace('_2', '₂'), ly: vn[1].replace('_1', '₁').replace('_2', '₂') }, c.fig, { restr: c.restr });
  _autoLP(P);
  const g = (capas) => grafico(P, capas);
  const idx = c.restr.map((r, i) => i);
  const nomV = 'ABCDEFGH';

  /* vértices */
  const { V: V0 } = _vertices(c.restr);
  let V = c.orden ? c.orden.map(([x, y]) => V0.find(v => v.x.eq(x) && v.y.eq(y))) : _ordenar(V0);
  V.forEach((v, i) => { v.nom = nomV[i]; v.F = fa.mul(v.x).add(fb.mul(v.y)); });
  const mejor = V.reduce((m, v) => (mx ? (v.F.cmp(m.F) > 0) : (v.F.cmp(m.F) < 0)) ? v : m, V[0]);
  const optimos = V.filter(v => v.F.eq(mejor.F));

  /* ecuación de cada línea (para vértices) */
  const nR = c.restr.length;
  const lineaDe = i => {
    if (i >= nR) { const ex = i === nR; return { a: new Fr(ex ? 1 : 0), b: new Fr(ex ? 0 : 1), c: new Fr(0), eqh: (ex ? X : Y) + '=0', eq: (ex ? X : Y) + '=0', eje: true }; }
    const r = c.restr[i];
    return { a: Fr.of(r.a), b: Fr.of(r.b), c: Fr.of(r.c), eqh: ce(r.k, r.eq), eq: r.eq, eje: false, i };
  };
  const paralela = l => l.a.n === 0 || l.b.n === 0;

  const pasos = [];
  pasos.push({ titulo: c.tituloVars || 'Elegimos las incógnitas', html: c.vars });
  if (c.tabla) pasos.push({ titulo: c.tablaTitulo || 'Organizamos los datos en una tabla', html: c.tabla });

  /* restricciones */
  pasos.push({ titulo: 'Restricciones',
    html: (c.restrIntro || '<p>Traducimos cada frase' + (c.tabla ? ' (cada fila de la tabla nos da una desigualdad)' : '') + ':</p>') +
      sis(c.restr.map(r => ce(r.k, r.ineq0 || r.ineq))) +
      (c.noNeg || '<p>Además, como son ' + (c.unidades || 'cantidades') + ', $' + X + '\\ge0$ e $' + Y + '\\ge0$.</p>') });

  if (c.trasRestr) (typeof c.trasRestr === 'function' ? c.trasRestr(g, P) : c.trasRestr).forEach(e => pasos.push(e));
  pasos.push({ titulo: 'Función objetivo', html: c.objetivo });

  /* rectas */
  const filas = c.restr.map(r => {
    const [p1, p2] = _dosPuntos(r, P);
    return ce(r.k, r.eq) + ' & ' + _punto(p1[0], p1[1]) + ' & ' + _punto(p2[0], p2[1]);
  });
  const verts = c.restr.filter(r => Math.abs(r.b) < 1e-12), hors = c.restr.filter(r => Math.abs(r.a) < 1e-12);
  const notaRect = (verts.length || hors.length)
    ? '<p class="nota">' + [verts.length ? verts.map(r => '$' + r.eq + '$').join(' y ') + (verts.length > 1 ? ' son rectas verticales' : ' es una recta vertical') : '',
      hors.length ? hors.map(r => '$' + r.eq + '$').join(' y ') + (hors.length > 1 ? ' son rectas horizontales' : ' es una recta horizontal') : ''].filter(Boolean).join('; ') + '.</p>'
    : '';
  pasos.push({ titulo: 'Rectas que limitan la región',
    html: '<p>Cada desigualdad está limitada por una recta (cambiamos $\\le$ o $\\ge$ por $=$). Para dibujarla, dos puntos:</p>' +
      '$$\\begin{array}{lll}' + filas.join('\\\\[2mm]') + '\\end{array}$$' + notaRect + (c.notaRectas || '') });
  pasos.push({ titulo: 'Dibujamos las rectas', html: g({ rectas: idx, etiquetas: true }) });

  /* lado de cada recta */
  const lados = c.restr.map(r => {
    const a = Fr.of(r.a), b = Fr.of(r.b), cc = Fr.of(r.c);
    if (r.test) {
      return '<p>' + f(ce(r.k, r.ineq)) + ' ' + r.test.html + '</p>';
    }
    const cumple = r.op === '<=' ? 0 <= cc.val() : 0 >= cc.val();
    const sust = (a.n !== 0 && b.n !== 0) ? '0+0' : '0';
    const rel = r.op === '<=' ? '\\le' : '\\ge';
    let lado;
    if (b.n === 0) lado = ((r.op === '>=') === (a.val() > 0)) ? 'a la derecha de la recta' : 'a la izquierda de la recta';
    else if (a.n === 0) lado = ((r.op === '>=') === (b.val() > 0)) ? 'por encima de la recta' : 'por debajo de la recta';
    else lado = null;
    const txtLado = cumple
      ? '⇒ el lado del origen' + (lado ? ': ' + lado : '')
      : '⇒ el lado contrario al origen' + (lado ? ': ' + lado : '');
    return '<p>' + f(ce(r.k, r.ineq)) + ' con $(0,0)$: $' + sust + rel + tx(cc) + '$ ' + (cumple ? '✓' : '✗') + ' &nbsp;' + txtLado + '.</p>';
  });
  pasos.push({ titulo: '¿Qué lado de cada recta?',
    html: '<p>Probamos un punto que no esté sobre la recta y vemos si cumple la desigualdad.</p>' + lados.join('') + (c.notaLados || '') });

  /* región */
  pasos.push({ titulo: 'Región factible',
    html: '<p>' + (c.regionTexto || 'Es la zona donde se cumplen todas las desigualdades a la vez:') + '</p>' + g({ rectas: idx, etiquetas: true, region: true }) + (c.notaRegion || '') });

  /* vértices */
  pasos.push({ titulo: 'Vértices de la región factible',
    html: '<p>' + (c.vertIntro || 'El ' + (mx ? 'máximo' : 'mínimo') + ' está en un vértice. Cada vértice es el corte de dos de las rectas: resolvemos el sistema de cada pareja.') + '</p>' });
  V.forEach(v => {
    /* pareja de rectas: mejor si alguna es paralela a un eje; sin ejes si se puede */
    let best = null, bestS = -1e9;
    const noEje = v.act.filter(i => i < nR);
    const cons = noEje.length >= 2 ? noEje : v.act;      // los ejes solo cuentan si no hay otras dos rectas
    for (let i = 0; i < cons.length; i++) for (let j = i + 1; j < cons.length; j++) {
      const l1 = lineaDe(cons[i]), l2 = lineaDe(cons[j]);
      const det = l1.a.mul(l2.b).sub(l2.a.mul(l1.b)); if (det.n === 0) continue;
      const s = (paralela(l1) ? 2 : 0) + (paralela(l2) ? 2 : 0) + (l1.eje || l2.eje ? 0 : 0.5) - 0.01 * (i + j);
      if (s > bestS) { bestS = s; best = [l1, l2]; }
    }
    const [l1, l2] = best;
    const sol = _resolver(l1, l2, v.nom, vn);
    const conj = /^y/.test(l2.eq) ? ' e ' : ' y ';
    const triple = cons.length > 2 ? (c.nTriple || '<p class="nota">Por este punto pasan más de dos de las rectas; con cualquier pareja sale el mismo resultado.</p>') : '';
    pasos.push({ titulo: 'Vértice $' + v.nom + '$: $' + l1.eq + '$' + conj + '$' + l2.eq + '$',
      html: sis([l1.eqh, l2.eqh]) + sol.html + triple + ((c.vnota && c.vnota[v.nom]) || '') });
  });
  const etV = V.map(v => {
    const dx0 = v.x.val(), dy0 = v.y.val();
    return { p: [dx0, dy0], lab: v.nom + '(' + txt(v.x) + (v.x.isInt() && v.y.isInt() ? ', ' : '; ') + txt(v.y) + ')', ...(c.vdesp && c.vdesp[v.nom] ? c.vdesp[v.nom] : {}) };
  });
  etV.forEach(e => { if (e.dx != null) e.fijo = true; });
  _autoVert(P, etV);
  pasos.push({ titulo: c.tituloVertices || (V.length === 3 ? 'Los tres vértices' : V.length === 4 ? 'Los cuatro vértices' : V.length === 5 ? 'Los cinco vértices' : 'Los vértices'),
    html: g({ rectas: idx, etiquetas: true, region: true, vertices: etV }) });

  /* valor de F en cada vértice */
  const filasF = V.map(v => {
    const pr1 = fa.n === 0 ? null : fa.mul(v.x), pr2 = fb.n === 0 ? null : fb.mul(v.y);
    const dosTerminos = pr1 && pr2 && fa.n !== 0 && fb.n !== 0;
    let calc = N + '=' + exprNum(fa, fb, v.x, v.y);
    if (dosTerminos && pr1.isInt() && pr2.isInt() && !(fa.eq(1) && fb.eq(1))) calc += '=' + tx(pr1) + (pr2.n < 0 ? '' : '+') + tx(pr2);
    calc += '=' + txa(v.F);
    return _nomc(v.nom, v.x, v.y).replace(/\\dfrac/g, '\\tfrac') + ':& ' + calc.replace(/\\dfrac/g, '\\tfrac');
  });
  const unid = c.unidadF || '';
  const hayFrac = V.some(v => !v.x.isInt() || !v.y.isInt() || !v.F.isInt());
  const concl = c.evalConclusion ||
    (optimos.length === 1
      ? '<p>El ' + (mx ? 'mayor' : 'menor') + ' de los valores es $' + tx(mejor.F) + '$, en $' + mejor.nom + '$.</p>'
      : '<p>El ' + (mx ? 'mayor' : 'menor') + ' valor es $' + tx(mejor.F) + '$ y se alcanza en ' + optimos.map(o => '$' + o.nom + '$').join(' y ') + '.</p>');
  pasos.push({ titulo: c.tituloEval || 'Valor de $' + N + '$ en cada vértice',
    html: (c.evalIntro || '<p>Sustituimos cada vértice en $' + c.F.tex + '$:</p>') +
      '$$\\begin{array}{ll}' + filasF.join(hayFrac ? '\\\\[3mm]' : '\\\\[2mm]') + '\\end{array}$$' + concl });

  if (c.extras) (typeof c.extras === 'function' ? c.extras(g, P, V) : c.extras).forEach(e => pasos.push(e));

  /* solución */
  const solMath = c.solMath || ('$$' + X + '=' + tx(mejor.x) + ',\\qquad ' + Y + '=' + tx(mejor.y) + ',\\qquad ' + N + '_{\\' + (mx ? 'max' : 'min') + '}=' + tx(mejor.F) + '$$');
  pasos.push({ caja: 'Solución', html: solMath + '<p><b class="res">' + c.res + '</b></p>' });

  /* comprobación */
  const sx = (c.solPunto ? Fr.of(c.solPunto[0]) : mejor.x), sy = (c.solPunto ? Fr.of(c.solPunto[1]) : mejor.y);
  const comp = c.restr.map(r => {
    const a = Fr.of(r.a), b = Fr.of(r.b), cc = Fr.of(r.c), val = a.mul(sx).add(b.mul(sy));
    const rel = r.op === '<=' ? '\\le' : '\\ge';
    const ok = r.op === '<=' ? val.cmp(cc) <= 0 : val.cmp(cc) >= 0;
    if (r.cmpTex) return '<p>' + r.cmpTex(sx, sy) + ' ✓</p>';
    const lhs = (a.n !== 0 && b.n !== 0) || (a.n !== 0 ? !a.eq(1) : !b.eq(1)) ? exprNum(a, b, sx, sy) + '=' : '';
    return '<p>$' + lhs + tx(val) + rel + tx(cc) + '$ ' + (ok ? '✓' : '✗') + '</p>';
  }).join('');
  pasos.push({ titulo: 'Comprobación',
    html: comp + (c.compExtra ? c.compExtra : '<p>$' + N + '=' + exprNum(fa, fb, sx, sy) + '=' + tx(fa.mul(sx).add(fb.mul(sy))) + '$ ' + (c.unidadF || '') + ' ✓</p>') });
  return pasos;
}

/* ===================================================================== */
const OPCIONES_MATE = {
  delimiters: [
    {left: "$$", right: "$$", display: true},
    {left: "$",  right: "$",  display: false}
  ],
  throwOnError: false,
  strict: false
};
const $ = id => document.getElementById(id);
function mate(el) { if (window.renderMathInElement) renderMathInElement(el, OPCIONES_MATE); }

/* ---------------------------------------------------------------------
   MOTOR DEL LIBRO
   - Cada ejercicio se trocea en "unidades" (un párrafo, una fórmula, una
     matriz...). Cada clic escribe la siguiente sección.
   - Las unidades se reparten en páginas de tamaño fijo (como un libro).
   - Se ven dos páginas. Cuando se llena la de la derecha, pasa a ser la
     de la izquierda y aparece una página nueva a la derecha.
   --------------------------------------------------------------------- */
const LW = 800;                     // ancho lógico de una página (px)
let actual = 0;                     // ejercicio activo
let s = 0;                          // unidades escritas
let G = {};                         // geometría
let libro = null;                   // {unidades, paginas}
let Lprev = 0;

function geometria() {
  const W = $("libro").clientWidth, H = $("libro").clientHeight;
  const Sw = W / 2, k = (Sw - 20) / LW;
  G = { W, H, Sw, k, LH: (H - 20) / k };
}

/* trocea un ejercicio en secciones y unidades (se hace una sola vez) */
function extraer(e) {
  if (e._sec) return e._sec;
  const stage = $("stage"), secs = [];
  const add = (tipo, cab, html, salto, mismo) => {
    const d = document.createElement("div");
    d.innerHTML = html;
    stage.appendChild(d);
    mate(d);
    const unidades = [];
    d.childNodes.forEach(n => {
      if (n.nodeType === 1) unidades.push(n);
      else if (n.nodeType === 3 && n.textContent.trim()) {
        const sp = document.createElement("span"); sp.textContent = n.textContent; unidades.push(sp);
      }
    });
    let cabHTML = null;
    if (cab) { const c = document.createElement("div"); c.innerHTML = cab; mate(c); cabHTML = c.innerHTML; }
    secs.push({ tipo, cabHTML, unidades, salto: !!salto, mismo: !!mismo });
  };
  add("titulo", null, "<h1>" + e.titulo + "</h1>" + (e.etiqueta ? '<div class="origen">' + e.etiqueta + "</div>" : ""));
  add("enun", null, e.enunciado, false, true);      // título y enunciado salen juntos con un clic
  e.pasos.forEach((p, i) => add(p.caja ? "caja" : "paso", p.caja || p.titulo, p.html, i === 0 || (p.caja && /^Si /.test(p.caja))));   // el primer paso siempre empieza en la página de la derecha: enunciado a la izquierda, planteamiento a la derecha
  stage.innerHTML = "";
  /* un "tic" = un clic. Cada sección es un bloque; dentro de una fila de menores
     (.fila-menores) cada .sub sale con su propio clic */
  let base = 0;
  secs.forEach(sc => {
    let cur = sc.mismo ? base : base + 1, nuevo = false;
    sc.unidades = sc.unidades.map(n => {
      if (nuevo) { cur++; nuevo = false; }
      const o = { n, t: cur, subs: [] };
      if (n.classList && n.classList.contains("fila-menores")) {
        n.querySelectorAll(".sub").forEach(sb => { cur++; o.subs.push({ n: sb, t: cur }); });
        nuevo = true;
      }
      return o;
    });
    base = cur;
  });
  e._T = base;
  e._sec = secs;
  return secs;
}

function crearCont(sc, sigue) {
  const c = document.createElement("div");
  c.className = "cont";
  if (sc.tipo === "caja") {
    c.classList.add("caja");
    if (!sigue) c.insertAdjacentHTML("afterbegin", '<span class="titulo">' + sc.cabHTML + "</span>");
  } else if (sc.tipo === "paso") {
    c.classList.add("paso");
    if (!sigue) c.insertAdjacentHTML("afterbegin", "<h4>" + sc.cabHTML + "</h4>");
  } else if (sc.tipo === "enun") {
    c.classList.add("caja", "enunciado");
  }
  if (sigue) c.classList.add("sigue");
  return c;
}

/* una fórmula más ancha que la página se reduce hasta caber */
function ajustar(u) {
  if (u.classList && u.classList.contains("fila-menores")) {
    u.style.zoom = "";
    if (u.scrollWidth > u.clientWidth + 2) u.style.zoom = String(Math.max(.55, u.clientWidth / u.scrollWidth * .97));
  }
  u.querySelectorAll(".katex-display").forEach(d => {
    const k = d.firstElementChild;
    if (!k) return;
    k.style.zoom = "";
    if (d.scrollWidth > d.clientWidth + 2) k.style.zoom = String(Math.max(.55, d.clientWidth / d.scrollWidth * .98));
  });
}

/* reparte las unidades en páginas del tamaño actual */
function paginar(secs, T) {
  secs.T = T;
  const pista = $("pista");
  pista.innerHTML = "";
  const paginas = [], unidades = [];
  const nueva = () => {
    const hoja = document.createElement("div");
    hoja.className = "hoja";
    hoja.style.cssText = "left:" + (paginas.length * G.Sw) + "px;width:" + G.Sw + "px;height:" + G.H + "px";
    const pag = document.createElement("div");
    pag.className = "pag";
    pag.style.cssText = "width:" + LW + "px;height:" + G.LH + "px;transform:scale(" + G.k + ")";
    const cu = document.createElement("div");
    cu.className = "cuerpo";
    cu.style.height = (G.LH - 34 - 56) + "px";
    const num = document.createElement("div");
    num.className = "num"; num.textContent = paginas.length + 1;
    pag.append(cu, num); hoja.appendChild(pag); pista.appendChild(hoja);
    const o = { hoja, cu };
    paginas.push(o);
    return o;
  };
  let pg = nueva();
  const desborda = () => pg.cu.scrollHeight > pg.cu.clientHeight + 1;
  secs.forEach(sc => {
    if (sc.salto && pg.cu.children.length) pg = nueva();
    let cont = crearCont(sc, false), puestas = 0;
    pg.cu.appendChild(cont);
    /* un bloque (lo que sale con un clic) nunca se parte entre dos páginas */
    const bloques = [];
    sc.unidades.forEach(un => {
      const ult = bloques[bloques.length - 1];
      if (ult && ult[0].t === un.t) ult.push(un); else bloques.push([un]);
    });
    bloques.forEach(bl => {
      bl.forEach(un => {
        un.n.classList.add("u"); un.n.classList.remove("on");
        un.subs.forEach(sb => { sb.n.classList.add("u"); sb.n.classList.remove("on"); });
        cont.appendChild(un.n);
      });
      bl.forEach(un => ajustar(un.n));
      if (desborda()) {
        bl.forEach(un => cont.removeChild(un.n));
        if (!puestas) pg.cu.removeChild(cont);
        if (pg.cu.children.length) pg = nueva();     // página nueva solo si la actual ya tiene algo
        cont = crearCont(sc, puestas > 0);
        pg.cu.appendChild(cont);
        bl.forEach(un => cont.appendChild(un.n));
        bl.forEach(un => ajustar(un.n));
      }
      puestas += bl.length;
      const pi = paginas.indexOf(pg);
      bl.forEach(un => {
        unidades.push({ u: un.n, cont, pag: pi, t: un.t, on: false });
        un.subs.forEach(sb => unidades.push({ u: sb.n, cont, pag: pi, t: sb.t, on: false }));
      });
    });
  });
  libro = { unidades, paginas, T: secs.T };
}

/* pone al día lo que se ve según s */
function aplicar(anim) {
  const U = libro.unidades;
  s = Math.max(0, Math.min(s, libro.T));
  const conts = new Map();
  U.forEach((o, i) => {
    const on = o.t <= s;
    if (on !== o.on) {
      o.on = on;
      if (on) { o.u.classList.remove("rapido"); o.u.classList.add("on"); }
      else { o.u.classList.add("rapido"); o.u.classList.remove("on"); }
    }
    if (on) conts.set(o.cont, true); else if (!conts.has(o.cont)) conts.set(o.cont, false);
  });
  conts.forEach((v, c) => {
    if (v) { c.classList.remove("rapido"); c.classList.add("on"); }
    else { c.classList.add("rapido"); c.classList.remove("on"); }
  });
  let p = 0;
  U.forEach(o => { if (o.t <= s) p = Math.max(p, o.pag); });
  const L = Math.max(p - 1, 0);
  const pista = $("pista");
  pista.classList.toggle("anim", !!anim);
  pista.style.transform = "translateX(" + (-L * G.Sw) + "px)";
  if (anim && L > Lprev) {
    const h = libro.paginas[p].hoja;
    h.classList.remove("gira"); void h.offsetWidth; h.classList.add("gira");
    setTimeout(() => h.classList.remove("gira"), 1000);
  }
  Lprev = L;
  const n = libro.T;
  $("contador").textContent = EJERCICIOS[actual].titulo + " · " + s + " / " + n;
  $("relleno").style.width = (n ? s / n * 100 : 0) + "%";
  $("btnAtras").disabled = (actual === 0 && s <= 1);
  $("btnAdelante").disabled = (actual === EJERCICIOS.length - 1 && s === n);
}

function pintarPestanas() {
  const nav = $("pestanas");
  nav.innerHTML = "";
  EJERCICIOS.forEach((e, i) => {
    const b = document.createElement("button");
    b.textContent = e.titulo.replace("Problema ", "P. ").replace("Práctica ", "Pr. ");
    b.setAttribute("aria-selected", i === actual);
    b.onclick = ev => { ev.stopPropagation(); cargar(i, false); };
    nav.appendChild(b);
  });
  const sel = nav.querySelector('[aria-selected="true"]');
  if (sel) sel.scrollIntoView({ inline: "center", block: "nearest" });
}

function construir() {
  geometria();
  const e = EJERCICIOS[actual];
  const secs = extraer(e);
  paginar(secs, e._T);
}

async function cargar(i, alFinal) {
  const lib = $("libro");
  lib.classList.add("fuera");
  await new Promise(r => setTimeout(r, 200));
  actual = i;
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
  construir();
  s = alFinal ? libro.T : 1;          // al abrir un ejercicio ya se ve el enunciado
  Lprev = 0;
  pintarPestanas();
  aplicar(false);
  lib.classList.remove("fuera");
}

function avanzar() {
  if (s < libro.T) { s++; aplicar(true); }
  else if (actual < EJERCICIOS.length - 1) cargar(actual + 1, false);
}
function retroceder() {
  if (s > 1) { s--; aplicar(true); }
  else if (actual > 0) cargar(actual - 1, true);
}

/* ---------------------------------------------------------------------
   SUBRAYADOR de las frases del enunciado
   - al pasar el ratón por una frase se colorea (cada frase, su color;
     si la ecuación sale de varios trozos, se colorean todos a la vez)
   - doble clic: queda fijada, como con un rotulador; otro doble clic la quita
   - en pantallas táctiles: un toque la colorea y un doble toque la fija
   --------------------------------------------------------------------- */
const frDe = ev => (ev.target && ev.target.closest) ? ev.target.closest(".fr") : null;
const grupoDe = fr => {
  const cont = fr.closest(".enunciado");
  return cont ? cont.querySelectorAll('.fr[data-g="' + fr.dataset.g + '"]') : [fr];
};
function alternarFija(fr) {
  const poner = !fr.classList.contains("fija");
  grupoDe(fr).forEach(n => n.classList.toggle("fija", poner));
}
let tipoPuntero = "mouse", ultimoToque = { el: null, t: 0 };
$("libro").addEventListener("mouseover", ev => {
  const fr = frDe(ev);
  if (fr) grupoDe(fr).forEach(n => n.classList.add("hov"));
});
$("libro").addEventListener("mouseout", ev => {
  const fr = frDe(ev);
  if (!fr) return;
  const a = ev.relatedTarget && ev.relatedTarget.closest ? ev.relatedTarget.closest(".fr") : null;
  if (a && a.dataset.g === fr.dataset.g && a.closest(".enunciado") === fr.closest(".enunciado")) return;
  grupoDe(fr).forEach(n => n.classList.remove("hov"));
});
$("libro").addEventListener("pointerdown", ev => { tipoPuntero = ev.pointerType || "mouse"; }, true);
$("libro").addEventListener("dblclick", ev => {
  const fr = frDe(ev);
  if (!fr) return;
  ev.preventDefault();
  if (tipoPuntero === "mouse") alternarFija(fr);
});
$("libro").addEventListener("pointerup", ev => {
  if (ev.pointerType === "mouse") return;
  const fr = frDe(ev);
  if (!fr) return;
  const ahora = Date.now();
  if (ultimoToque.el === fr && ahora - ultimoToque.t < 400) {
    alternarFija(fr);
    ultimoToque = { el: null, t: 0 };
  } else {
    document.querySelectorAll(".fr.hov").forEach(n => n.classList.remove("hov"));
    grupoDe(fr).forEach(n => n.classList.add("hov"));
    ultimoToque = { el: fr, t: ahora };
  }
});
$("btnBorrar").onclick = ev => {
  ev.stopPropagation();
  document.querySelectorAll(".fr.fija, .fr.hov").forEach(n => n.classList.remove("fija", "hov"));
};

/* clic: tercio izquierdo = atrás; resto = adelante (sobre una frase del enunciado no avanza) */
$("libro").addEventListener("click", ev => {
  if (frDe(ev)) return;
  if (String(window.getSelection())) return;
  if (ev.clientX < window.innerWidth / 3) retroceder(); else avanzar();
});
$("btnAtras").onclick = ev => { ev.stopPropagation(); retroceder(); };
$("btnAdelante").onclick = ev => { ev.stopPropagation(); avanzar(); };
$("tira").onclick = ev => {
  ev.stopPropagation();
  const r = $("tira").getBoundingClientRect();
