<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geometría en el espacio: rectas y planos (ejercicios 11-20)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<style>
  :root{
    --texto:#111; --verde-fondo:#E5FFE5; --verde-borde:#80FF80; --verde-titulo:#5CD65C;
    --azul:#1414E6; --rojo:#E01E1E; --gris:#666;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;color:var(--texto);cursor:pointer;
    font-family:"Latin Modern Roman","CMU Serif","Computer Modern Serif","Palatino Linotype",Palatino,Georgia,serif;
    font-size:20px;line-height:1.55;-webkit-tap-highlight-color:transparent}

  html,body{overflow:hidden}
  body{background:#fff}

  /* barra superior */
  .barra-sup{position:fixed;top:0;left:0;right:0;height:46px;z-index:5;background:#fff;border-bottom:1px solid #ddd;
    padding:0 14px;display:flex;gap:14px;align-items:center;font-size:.85rem;color:var(--gris)}
  .barra-sup .tit{font-weight:bold;color:#333;white-space:nowrap}
  .pestanas{display:flex;gap:6px;margin-left:auto;overflow-x:auto;scrollbar-width:none;padding:2px 0}
  .pestanas::-webkit-scrollbar{display:none}
  .pestanas button{font:inherit;font-size:.85rem;padding:3px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;
    background:#fff;border:1.5px solid #333;color:#333}
  .pestanas button[aria-selected="true"]{background:#333;color:#fff}

  /* barra inferior: botones grandes (pizarra digital) y progreso */
  .progreso{position:fixed;left:0;right:0;bottom:0;height:52px;z-index:5;background:#fff;border-top:1px solid #ddd;
    display:flex;align-items:center;gap:14px;padding:0 14px;font-size:.85rem;color:var(--gris)}
  .progreso .tira{flex:1;height:10px;background:#e8e8e8;border-radius:5px;overflow:hidden;cursor:pointer}
  .progreso .tira i{display:block;height:100%;background:#2e9e2e;transition:width .35s ease}
  .progreso .nav{font:inherit;font-size:1.5rem;line-height:1;width:64px;height:38px;border-radius:10px;cursor:pointer;
    background:#fff;border:2px solid #2e9e2e;color:#2e9e2e}
  .progreso .nav:active{background:#2e9e2e;color:#fff}
  .progreso .nav:disabled{opacity:.3;cursor:default}
  #contador{min-width:9.5em;text-align:right;white-space:nowrap}

  /* el libro: dos páginas, separadas solo por una línea fina */
  #libro{position:fixed;left:0;right:0;top:46px;bottom:52px;overflow:hidden;background:#fff;transition:opacity .25s ease}
  #libro.fuera{opacity:0}
  #pista{position:absolute;left:0;top:0;height:100%;will-change:transform}
  #pista.anim{transition:transform .9s cubic-bezier(.65,.05,.25,1)}
  .hoja{position:absolute;top:0;padding:6px 8px}
  .pag{position:relative;background:#fff;transform-origin:0 0;padding:30px 40px 0}
  .pag .cuerpo{display:flow-root;overflow:hidden}
  .pag .num{position:absolute;left:0;right:0;bottom:12px;text-align:center;color:#bbb;font-size:.8rem}
  #lomo{position:absolute;left:50%;top:14px;bottom:14px;width:0;border-left:1px solid #c9c9c9;pointer-events:none;z-index:2}
  .hoja.gira .pag{animation:gira .9s ease both}
  @keyframes gira{from{opacity:0}to{opacity:1}}
  @media (prefers-reduced-motion:reduce){#pista.anim{transition:none}.hoja.gira .pag{animation:none}}

  /* lo que se va escribiendo */
  .cont{opacity:0;transition:opacity .35s ease}
  .cont.on{opacity:1}
  .u{opacity:0;clip-path:inset(-40px 100% -40px -40px);transition:opacity .25s ease,clip-path .85s ease}
  span.u{display:block}
  .u.on{opacity:1;clip-path:inset(-40px -40px -40px -40px)}
  .u.rapido,.cont.rapido{transition:none}
  .cont.sigue{margin-top:0;padding-top:14px;border-top-left-radius:0;border-top-right-radius:0}
  .fila-menores{display:flex;justify-content:space-around;align-items:center;gap:.4em;margin:.8em 0}
  .fila-menores .sub{display:block;white-space:nowrap}
  .fila-menores.col{flex-direction:column;align-items:center;gap:.1em;margin:.4em 0}
  .fila-menores.junto{flex-direction:column;align-items:stretch;gap:.35em;margin:.8em 0}
  .junto .fila3{display:flex;justify-content:space-around;gap:.8em}
  .junto .item{display:block;white-space:nowrap}
  h1{margin:0 0 6px;font-size:2.1rem;line-height:1.2}
  h4{margin:16px 0 6px;font-size:1.18rem}

  /* cajas verdes del modelo */
  .caja{position:relative;background:var(--verde-fondo);border:1.5px solid var(--verde-borde);
    border-radius:8px;padding:20px 20px 10px;margin:26px 0 14px}
  .caja>.titulo{position:absolute;top:-13px;left:12px;background:var(--verde-titulo);color:#fff;
    font-weight:bold;padding:1px 12px;border-radius:5px;font-size:.92rem}
  .caja.enunciado{color:var(--azul);margin-top:6px;padding-top:12px}
  .caja p{margin:.3em 0 .5em}
  .paso{margin:6px 0 10px}

  /* matrices con menores marcados en caja roja */
  .ec{display:flex;align-items:center;justify-content:center;gap:.5em;margin:.6em 0;flex-wrap:wrap}
  .mat{--w:2.5em;--h:1.7em;position:relative;display:inline-grid;
    grid-template-columns:repeat(var(--nc),var(--w));grid-auto-rows:var(--h);
    margin:1.1em .7em .2em;text-align:center}
  .mat .c{display:flex;align-items:center;justify-content:center;white-space:nowrap}
  .mat::before,.mat::after{content:"";position:absolute;top:-.15em;bottom:-.15em;width:.55em;border:2px solid #111}
  .mat::before{left:-.7em;border-right:0;border-radius:60% 0 0 60%/50% 0 0 50%}
  .mat::after{right:-.7em;border-left:0;border-radius:0 60% 60% 0/0 50% 50% 0}
  .mat .bar{position:absolute;top:.1em;bottom:.1em;left:calc(var(--k) * var(--w));border-left:1.5px solid #111}
  .mat .caja-roja{position:absolute;border:1.5px solid var(--rojo);pointer-events:none;
    left:calc(var(--c0) * var(--w) + .15em);top:calc(var(--r0) * var(--h) + .12em);
    width:calc(var(--cs) * var(--w) - .3em);height:calc(var(--rs) * var(--h) - .24em)}
  .mat .caja-roja i{position:absolute;left:50%;top:-1.35em;transform:rotate(-40deg);transform-origin:left bottom;
    color:var(--rojo);font-style:normal;white-space:nowrap}
  .mat .tacha{position:absolute;left:-.2em;right:-.2em;top:calc((var(--r) + .5) * var(--h));
    border-top:1.5px solid var(--rojo);pointer-events:none}
  .mat .etq{position:absolute;left:calc((var(--c) + .5) * var(--w));top:-.15em;width:0;height:0;pointer-events:none}
  .mat .etq i{position:absolute;left:0;bottom:0;transform:rotate(-40deg);transform-origin:left bottom;
    color:var(--rojo);font-style:normal;white-space:nowrap}
  .instr{color:var(--azul);border:1.5px solid #E6C200;border-radius:14px;padding:6px 16px;margin:10px 0;text-align:center}
  .nota{color:var(--gris);font-size:.9em}
  b.res{color:var(--rojo)}
  .katex-display{margin:.6em 0;overflow-x:auto;overflow-y:hidden}
  table.res{border-collapse:collapse;margin:6px auto 8px}
  table.res th,table.res td{padding:5px 16px;text-align:center}
  table.res th{border-bottom:1.5px solid #111}
  table.res td:not(:last-child),table.res th:not(:last-child){border-right:1px solid #111}
  table.res td:last-child,table.res th:last-child{text-align:left}

  /* figuras 3D interactivas */
  .fig3d{margin:.5em 0 .3em}
  .fig3d canvas{display:block;width:100%;height:auto;aspect-ratio:1400/480;border:1px solid #dcdcdc;border-radius:12px;background:#fff;cursor:grab;touch-action:none}
  .fig3d canvas.arrastrando{cursor:grabbing}
  .fig-ctl{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:.35em;font-size:.78em;color:var(--gris);line-height:1.25}
  .fig-botones{display:flex;gap:5px;flex:none}
  .fig-botones button{font:inherit;font-size:.9em;min-width:1.9em;height:1.9em;border-radius:999px;border:1.5px solid #bbb;background:#fff;color:#444;cursor:pointer;padding:0 .4em}
  .fig-botones button[aria-pressed="true"]{background:#2d9a2d;border-color:#2d9a2d;color:#fff}
</style>
</head>
<body>
<div class="barra-sup">
  <span class="tit">Geometría en el espacio · Ejercicios 11-20</span>
  <nav class="pestanas" id="pestanas" aria-label="Ejercicios"></nav>
</div>
<div id="libro"><div id="pista"></div><div id="lomo"></div></div>
<div id="stage" style="position:absolute;left:-99999px;top:0;width:720px;visibility:hidden"></div>
<div class="progreso">
  <button class="nav" id="btnAtras" title="Retroceder (←)">‹</button>
  <button class="nav" id="btnAdelante" title="Avanzar (→)">›</button>
  <div class="tira" id="tira"><i id="relleno"></i></div>
  <span id="contador"></span>
</div>

<script>
/* ---------------------------------------------------------------------
   Matriz con barra opcional y menor marcado en caja roja.
   rows: filas (cadenas LaTeX); opts.bar = nº de columnas antes de la barra;
   opts.box = [fila0, col0, fila1, col1] (empezando en 0)
   opts.tach = [filas a tachar]; opts.etq = [[columna, 'texto'], ...] (rótulo rojo sobre una columna)
   --------------------------------------------------------------------- */
function mat(rows, opts = {}) {
  const nr = rows.length, nc = rows[0].length;
  const largo = Math.max(...rows.map(r => Math.max(...r.map(c => String(c).replace(/\\[a-zA-Z]+|[{}\s]/g, '').length))));
  const ancho = opts.w || Math.max(2.5, 1.0 + 0.55 * largo);
  let h = '<span class="mat" style="--nc:' + nc + ';--nr:' + nr + ';--w:' + ancho.toFixed(2) + 'em' + (opts.etq ? ';margin-top:2.3em' : '') + '">';
  rows.forEach(r => r.forEach(c => { h += '<span class="c">$' + c + '$</span>'; }));
  if (opts.bar != null) h += '<span class="bar" style="--k:' + opts.bar + '"></span>';
  if (opts.box) {
    /* box = [f0,c0,f1,c1] o, para un menor de columnas no contiguas, una lista de cajas;
       el rótulo ≠0 solo va en la primera */
    const cajas = Array.isArray(opts.box[0]) ? opts.box : [opts.box];
    cajas.forEach(([r0, c0, r1, c1], i) => {
      h += '<span class="caja-roja" style="--r0:' + r0 + ';--c0:' + c0 + ';--rs:' + (r1 - r0 + 1) +
           ';--cs:' + (c1 - c0 + 1) + '">' + (i === 0 ? '<i>$\\neq0$</i>' : '') + '</span>';
    });
  }
  if (opts.tach) opts.tach.forEach(r => { h += '<span class="tacha" style="--r:' + r + '"></span>'; });
  if (opts.etq) opts.etq.forEach(([c, t]) => { h += '<span class="etq" style="--c:' + c + '"><i>$' + t + '$</i></span>'; });
  return h + '</span>';
}
const ec = (...partes) => '<div class="ec">' + partes.join('') + '</div>';
const f = s => '<span>$' + s + '$</span>';

/* ---------------------------------------------------------------------
   Ayudantes numéricos y de escritura
   --------------------------------------------------------------------- */
const rg = x => '\\operatorname{rg}(' + x + ')';
const detTex = filas => '\\begin{vmatrix} ' + filas.map(r => r.join('&')).join('\\\\ ') + ' \\end{vmatrix}';
const strs = M => M.map(r => r.map(String));

/* regla de Sarrus para un determinante numérico de orden 3 */
const det3 = M => M[0][0] * (M[1][1] * M[2][2] - M[1][2] * M[2][1])
                - M[0][1] * (M[1][0] * M[2][2] - M[1][2] * M[2][0])
                + M[0][2] * (M[1][0] * M[2][1] - M[1][1] * M[2][0]);
const suma = t => t.map((x, i) => (i && x >= 0) ? '+' + x : String(x)).join('');
function sarrusTex(M0) {
  const a = M0.map(r => r.map(Number));
  const p = [a[0][0] * a[1][1] * a[2][2], a[0][1] * a[1][2] * a[2][0], a[0][2] * a[1][0] * a[2][1]];
  const n = [a[0][2] * a[1][1] * a[2][0], a[0][0] * a[1][2] * a[2][1], a[0][1] * a[1][0] * a[2][2]];
  return '(' + suma(p) + ')-(' + suma(n) + ')=' + det3(a);
}

/* sistema de ecuaciones con las igualdades alineadas: sis(['x','2+\\lambda'], ['y', ...]) */
const sis = (...filas) => '$$\\left\\{\\begin{array}{rcl}' + filas.map(r => r.join('&=&')).join('\\\\') + '\\end{array}\\right.$$';

/* menor marcado con caja roja dentro de una fracción o igualdad (se ve como en el cuaderno) */
const cajaR = x => '{\\color{#E01E1E}\\boxed{\\color{#111}' + x + '}}';

/* un determinante de Cramer por clic: etiqueta, matriz numérica 3x3 */
const cramer = (etq, M) => '<span class="sub">$\\displaystyle ' + etq + '=' + detTex(M) + '=' + sarrusTex(M) + '$</span>';
const filaCol = (...subs) => '<div class="fila-menores col">' + subs.join('') + '</div>';


/* =====================================================================
   FIGURAS 3D INTERACTIVAS (canvas, sin librerías)
   - Cada figura es una escena con elementos que aparecen por etapas
     (como las imágenes sucesivas del libro).
   - Se gira arrastrando con el ratón o el dedo; doble clic = vista inicial.
   - Coordenadas reales (eje z hacia arriba).
   ===================================================================== */
const V3 = {
  add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
  sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
  mul: (a, k) => [a[0] * k, a[1] * k, a[2] * k],
  dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
  cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
  len: a => Math.hypot(a[0], a[1], a[2]),
  unit: a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; }
};

/* plano de normal n que pasa por c: cuadrado de semilado h. 'hint' orienta el primer lado */
function planoN(c, n, h, hint) {
  n = V3.unit(n);
  let e1 = hint ? V3.sub(hint, V3.mul(n, V3.dot(hint, n)))
                : V3.cross(n, Math.abs(n[2]) < .9 ? [0, 0, 1] : [1, 0, 0]);
  e1 = V3.unit(e1);
  const e2 = V3.unit(V3.cross(n, e1));
  return { o: V3.sub(V3.sub(c, V3.mul(e1, h)), V3.mul(e2, h)), u: V3.mul(e1, 2 * h), v: V3.mul(e2, 2 * h), a: [0, 1], b: [0, 1] };
}
/* plano P + a·u + b·v con a en [a0,a1] y b en [b0,b1] */
function planoUV(P, u, v, a0, a1, b0, b1) {
  return { o: V3.add(V3.add(P, V3.mul(u, a0)), V3.mul(v, b0)), u: V3.mul(u, a1 - a0), v: V3.mul(v, b1 - b0), a: [0, 1], b: [0, 1] };
}

const COL = { r: '#1414E6', s: '#6AA800', vec: '#E01E1E', vec2: '#C026D3', pt: '#111', verde: '#10CC50', rosa: '#E0409A', azul: '#3B5BDB', naranja: '#F08C00', gris: '#555' };

/* ---------------------------------------------------------------------
   ESCENAS. Elementos:
   pt {p,l,c,s,big,d}           punto
   vec {a,b,l,c,s,d}            vector (flecha de a a b)
   line {p,v,l,c,s,d}           recta infinita (se recorta)
   plane {...planoN|planoUV,c,s,l}
   s = etapa desde la que se ve; focus = puntos que encuadran la figura
   --------------------------------------------------------------------- */
const FIGS = {};

/* Ej. 1: recta por P con vector director v */
(() => {
  const P = [2, 1, -3], v = [1, -2, 4];
  FIGS.ej1 = {
    focus: [P, V3.add(P, v), V3.sub(P, V3.mul(v, .6))],
    etapas: ['Punto $P$ y vector director $v$', 'La recta $r$ pasa por $P$ con la dirección de $v$'],
    els: [
      { t: 'line', p: P, v: v, l: 'r', c: COL.r, s: 1, d: [14, -10] },
      { t: 'vec', a: P, b: V3.add(P, v), l: 'v', c: COL.vec, s: 0, d: [12, -6] },
      { t: 'pt', p: P, l: 'P', c: COL.pt, s: 0, d: [-18, 4] }
    ]
  };
})();

/* Ej. 2: recta por dos puntos */
(() => {
  const P = [2, 1, 3], Q = [0, -1, 3], d = V3.sub(Q, P);
  FIGS.ej2 = {
    focus: [P, Q],
    etapas: ['Los puntos $P$ y $Q$', 'El vector diferencia $\\overrightarrow{PQ}$', 'La recta $r$ que pasa por $P$ y $Q$'],
    els: [
      { t: 'line', p: P, v: d, l: 'r', c: COL.r, s: 2, d: [14, -10] },
      { t: 'vec', a: P, b: Q, l: 'V_d', c: COL.vec2, s: 1, d: [-8, -14] },
      { t: 'pt', p: P, l: 'P', c: COL.pt, s: 0, d: [10, 10] },
      { t: 'pt', p: Q, l: 'Q', c: COL.pt, s: 0, d: [-18, -6] }
    ]
  };
})();

/* Ej. 3: recta como intersección de dos planos */
(() => {
  const P = [0, 1, -1], n1 = [1, 1, 1], n2 = [1, 1, -1], d = [1, -1, 0];
  FIGS.ej3 = {
    focus: [P, V3.add(P, V3.mul(d, 1.6)), V3.sub(P, V3.mul(d, 1.6))],
    etapas: ['Los dos planos $x+y+z=0$ y $x+y-z=2$', 'Sus vectores normales $\\vec n_1$ y $\\vec n_2$', 'La intersección es la recta $r$, con $\\vec v=\\vec n_1\\times\\vec n_2$'],
    els: [
      { t: 'plane', ...planoN(P, n1, 2.6, d), c: COL.verde, s: 0, l: 'α', ld: [.08, .1] },
      { t: 'plane', ...planoN(P, n2, 2.6, d), c: COL.azul, s: 0, l: 'β', ld: [.08, .1] },
      { t: 'vec', a: P, b: V3.add(P, n1), l: 'n_1', c: COL.gris, s: 1, d: [8, -8] },
      { t: 'vec', a: P, b: V3.add(P, n2), l: 'n_2', c: COL.gris, s: 1, d: [8, 12] },
      { t: 'line', p: P, v: d, l: 'r', c: COL.r, s: 2, d: [12, -10] },
      { t: 'vec', a: P, b: V3.add(P, V3.mul(d, 1.4)), l: 'v', c: COL.vec, s: 2, d: [6, -14] },
      { t: 'pt', p: P, l: 'P', c: COL.pt, s: 2, d: [-18, 4] }
    ]
  };
})();

/* Ej. 4: plano por un punto con dos vectores directores */
(() => {
  const P = [1, 2, -3], u = [0, 2, 1], v = [4, -2, 0];
  FIGS.ej4 = {
    focus: [P, V3.add(P, u), V3.add(P, v), V3.add(V3.add(P, u), v)],
    etapas: ['El punto $P$ y los vectores $\\vec u$ y $\\vec v$', 'El plano $P+\\lambda\\vec u+\\mu\\vec v$'],
    els: [
      { t: 'plane', ...planoUV(P, u, v, -.5, 1.5, -.3, 1.3), c: COL.verde, s: 1, l: 'π', ld: [.1, .1] },
      { t: 'vec', a: P, b: V3.add(P, u), l: 'u', c: COL.vec, s: 0, d: [-14, -8] },
      { t: 'vec', a: P, b: V3.add(P, v), l: 'v', c: COL.vec2, s: 0, d: [8, -12] },
      { t: 'pt', p: P, l: 'P', c: COL.pt, s: 0, d: [-18, 8] }
    ]
  };
})();

/* Ej. 5: plano por tres puntos */
(() => {
  const A = [1, 2, -1], B = [0, 0, 1], C = [2, 2, 2], u = V3.sub(B, A), v = V3.sub(C, A);
  FIGS.ej5 = {
    focus: [A, B, C],
    etapas: ['Los tres puntos $A$, $B$ y $C$', 'Los vectores diferencia $\\overrightarrow{AB}$ y $\\overrightarrow{AC}$', 'El plano que pasa por $A$, $B$ y $C$'],
    els: [
      { t: 'plane', ...planoUV(A, u, v, -.4, 1.5, -.4, 1.5), c: COL.naranja, s: 2, l: 'π', ld: [.1, .1] },
      { t: 'vec', a: A, b: B, l: 'u', c: COL.vec2, s: 1, d: [-14, -8] },
      { t: 'vec', a: A, b: C, l: 'v', c: COL.vec, s: 1, d: [8, -12] },
      { t: 'pt', p: A, l: 'A', c: COL.pt, s: 0, d: [-18, 8] },
      { t: 'pt', p: B, l: 'B', c: COL.pt, s: 0, d: [-16, -8] },
      { t: 'pt', p: C, l: 'C', c: COL.pt, s: 0, d: [10, -10] }
    ]
  };
})();

/* ---------------------------------------------------------------------
   Dibujo
   --------------------------------------------------------------------- */
const CW = 1400, CH = 480, K = 1.7;
function rgba(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}

/* texto con subíndices simples: "V_r", "P_s" */
function rotulo(ctx, txt, x, y, col, tam) {
  ctx.fillStyle = col;
  const m = txt.split('_');
  ctx.font = 'italic ' + tam + 'px "Latin Modern Roman","CMU Serif",Georgia,serif';
  ctx.fillText(m[0], x, y);
  if (m[1]) {
    const w = ctx.measureText(m[0]).width;
    ctx.font = 'italic ' + (tam * .7) + 'px "Latin Modern Roman","CMU Serif",Georgia,serif';
    ctx.fillText(m[1], x + w + 1, y + tam * .22);
  }
}

function dibujarFigura(F, st, ctx) {
  const { els } = F;
  const C = F._C, R = F._R, L = R * 1.05;
  const esc = (CH * .5 * .93) / R;
  const cy = Math.cos(st.yaw), sy = Math.sin(st.yaw), cp = Math.cos(st.pitch), sp = Math.sin(st.pitch);
  const proj = p => {
    const q = V3.sub(p, C);
    const x1 = q[0] * cy - q[1] * sy, y1 = q[0] * sy + q[1] * cy, z1 = q[2];
    return { x: CW / 2 + x1 * esc, y: CH / 2 - (z1 * cp + y1 * sp) * esc, d: y1 * cp - z1 * sp };
  };
  const recorte = (p, v) => {
    const w = V3.sub(C, p), a = V3.dot(v, v), k = V3.dot(w, v);
    const d2 = V3.dot(w, w) - k * k / a;
    if (d2 > L * L) return null;
    const h = Math.sqrt(L * L - d2) / Math.sqrt(a), t0 = k / a;
    return [t0 - h, t0 + h];
  };
  ctx.clearRect(0, 0, CW, CH);

  /* ejes */
  ctx.lineWidth = 2;
  [['x', [1, 0, 0]], ['y', [0, 1, 0]], ['z', [0, 0, 1]]].forEach(([nom, e]) => {
    const r = recorte([0, 0, 0], e);
    if (!r) return;
    const t0 = Math.max(r[0], -L), t1 = Math.min(r[1], L);
    const a = proj(V3.mul(e, t0)), b = proj(V3.mul(e, t1));
    ctx.strokeStyle = 'rgba(0,0,0,.18)';
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    if (t1 > 0) rotulo(ctx, nom, b.x + 6, b.y - 4, 'rgba(0,0,0,.38)', 26);
  });

  /* planos, del más lejano al más cercano */
  const planos = els.filter(e => e.t === 'plane' && e.s <= st.etapa).map(e => {
    const q = (a, b) => V3.add(V3.add(e.o, V3.mul(e.u, a)), V3.mul(e.v, b));
    const c4 = [q(0, 0), q(1, 0), q(1, 1), q(0, 1)].map(proj);
    return { e, c4, d: (c4[0].d + c4[1].d + c4[2].d + c4[3].d) / 4 };
  }).sort((p, q) => q.d - p.d);
  planos.forEach(({ e, c4 }) => {
    const m0 = { x: (c4[0].x + c4[3].x) / 2, y: (c4[0].y + c4[3].y) / 2 };
    const m1 = { x: (c4[1].x + c4[2].x) / 2, y: (c4[1].y + c4[2].y) / 2 };
    const g = ctx.createLinearGradient(m0.x, m0.y, m1.x, m1.y);
    g.addColorStop(0, rgba(e.c, .62)); g.addColorStop(1, rgba(e.c, .10));
    ctx.fillStyle = g;
    ctx.beginPath(); c4.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = rgba(e.c, .55); ctx.lineWidth = 2; ctx.stroke();
    if (e.l) {
      const q = V3.add(V3.add(e.o, V3.mul(e.u, e.ld[0])), V3.mul(e.v, e.ld[1])), p = proj(q);
      rotulo(ctx, e.l, p.x, p.y, rgba(e.c, 1), 30);
    }
  });

  /* rectas */
  els.filter(e => e.t === 'line' && e.s <= st.etapa).forEach(e => {
    const r = recorte(e.p, e.v);
    if (!r) return;
    const a = proj(V3.add(e.p, V3.mul(e.v, r[0]))), b = proj(V3.add(e.p, V3.mul(e.v, r[1])));
    ctx.strokeStyle = e.c; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    const t = r[1] - (r[1] - r[0]) * .06, p = proj(V3.add(e.p, V3.mul(e.v, t)));
    rotulo(ctx, e.l, p.x + e.d[0] * K, p.y + e.d[1] * K, e.c, 32);
  });

  /* segmentos discontinuos */
  els.filter(e => e.t === 'seg' && e.s <= st.etapa).forEach(e => {
    const a = proj(e.a), b = proj(e.b);
    ctx.strokeStyle = e.c; ctx.lineWidth = 3.5; ctx.setLineDash([16, 11]); ctx.lineCap = 'butt';
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); ctx.setLineDash([]);
    if (e.l) rotulo(ctx, e.l, (a.x + b.x) / 2 + e.d[0] * K, (a.y + b.y) / 2 + e.d[1] * K, e.c, 30);
  });

  /* vectores */
  els.filter(e => e.t === 'vec' && e.s <= st.etapa).forEach(e => {
    const a = proj(e.a), b = proj(e.b);
    const ang = Math.atan2(b.y - a.y, b.x - a.x), h = 20;
    ctx.strokeStyle = e.c; ctx.fillStyle = e.c; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x - Math.cos(ang) * h * .6, b.y - Math.sin(ang) * h * .6); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(b.x, b.y);
    ctx.lineTo(b.x - h * Math.cos(ang - .38), b.y - h * Math.sin(ang - .38));
    ctx.lineTo(b.x - h * Math.cos(ang + .38), b.y - h * Math.sin(ang + .38)); ctx.closePath(); ctx.fill();
    rotulo(ctx, e.l, (a.x + b.x) / 2 + e.d[0] * K, (a.y + b.y) / 2 + e.d[1] * K, e.c, 30);
  });

  /* puntos */
  els.filter(e => e.t === 'pt' && e.s <= st.etapa).forEach(e => {
    const p = proj(e.p);
    ctx.fillStyle = e.c; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(p.x, p.y, e.big ? 11 : 7, 0, 7); ctx.fill(); ctx.stroke();
    rotulo(ctx, e.l, p.x + e.d[0] * K, p.y + e.d[1] * K, e.c, e.big ? 34 : 32);
  });
}


/* encuadre (centro y radio) con todo lo que se dibuja; mejor vista inicial */
function preparar(F) {
  const pts = [...F.focus];
  F.els.forEach(e => {
    if (e.t === 'pt') pts.push(e.p);
    if (e.t === 'vec' || e.t === 'seg') { pts.push(e.a, e.b); }
    if (e.t === 'plane') [[0, 0], [1, 0], [1, 1], [0, 1]].forEach(([a, b]) => pts.push(V3.add(V3.add(e.o, V3.mul(e.u, a)), V3.mul(e.v, b))));
  });
  const mn = [0, 1, 2].map(i => Math.min(...pts.map(p => p[i]))), mx = [0, 1, 2].map(i => Math.max(...pts.map(p => p[i])));
  F._C = [0, 1, 2].map(i => (mn[i] + mx[i]) / 2);
  F._R = Math.max(1.5, ...pts.map(p => V3.len(V3.sub(p, F._C))));
  /* vista: planos vistos en oblicuo y rectas/vectores sin acortar */
  let mejor = -1e9, vista = [3.55, .4];
  for (let yaw = 0; yaw < 6.28; yaw += .12) for (let pitch = .25; pitch <= .8; pitch += .11) {
    const f = [Math.sin(yaw) * Math.cos(pitch), Math.cos(yaw) * Math.cos(pitch), -Math.sin(pitch)];
    let pl = 1, li = 1;
    F.els.forEach(e => {
      if (e.t === 'plane') pl = Math.min(pl, Math.min(Math.abs(V3.dot(V3.unit(V3.cross(e.u, e.v)), f)), .62));
      if (e.t === 'line') li = Math.min(li, Math.sqrt(1 - V3.dot(V3.unit(e.v), f) ** 2));
      if (e.t === 'vec') li = Math.min(li, Math.sqrt(1 - V3.dot(V3.unit(V3.sub(e.b, e.a)), f) ** 2));
    });
    const sc = 2 * pl + li - .05 * Math.abs(Math.sin((yaw - 3.55) / 2)) - .1 * Math.abs(pitch - .45);
    if (sc > mejor) { mejor = sc; vista = [yaw, pitch]; }
  }
  F._vista = vista;
}

/* monta cada <div class="fig3d" data-fig="ejN"> dentro de root */
function initFiguras(root) {
  root.querySelectorAll('.fig3d').forEach(box => {
    const F = FIGS[box.dataset.fig];
    if (!F || box._ok) return;
    box._ok = true;
    if (!F._C) preparar(F);
    const st = { yaw: (F.vista || F._vista)[0], pitch: (F.vista || F._vista)[1], etapa: F.etapas.length - 1 };
    const ini = { yaw: st.yaw, pitch: st.pitch };
    box.innerHTML = '<canvas width="' + CW + '" height="' + CH + '"></canvas>' +
      '<div class="fig-ctl"><span class="fig-pie"></span><span class="fig-botones"></span></div>';
    const cv = box.querySelector('canvas'), ctx = cv.getContext('2d');
    const pie = box.querySelector('.fig-pie'), bot = box.querySelector('.fig-botones');
    const pinta = () => dibujarFigura(F, st, ctx);
    const poner = () => {
      pie.innerHTML = F.etapas[st.etapa];
      mate(pie);
      bot.querySelectorAll('button').forEach((b, i) => b.setAttribute('aria-pressed', i === st.etapa));
      pinta();
    };
    F.etapas.forEach((_, i) => {
      const b = document.createElement('button');
      b.textContent = i + 1;
      b.title = 'Etapa ' + (i + 1);
      b.onclick = () => { st.etapa = i; poner(); };
      bot.appendChild(b);
    });
    const rb = document.createElement('button');
    rb.textContent = '⟲'; rb.title = 'Vista inicial';
    rb.onclick = () => { st.yaw = ini.yaw; st.pitch = ini.pitch; pinta(); };
    bot.appendChild(rb);
    /* girar arrastrando */
    let arr = null;
    cv.addEventListener('pointerdown', ev => { arr = { x: ev.clientX, y: ev.clientY }; cv.setPointerCapture(ev.pointerId); cv.classList.add('arrastrando'); });
    cv.addEventListener('pointermove', ev => {
      if (!arr) return;
      st.yaw -= (ev.clientX - arr.x) * .009;
      st.pitch = Math.max(-1.45, Math.min(1.45, st.pitch + (ev.clientY - arr.y) * .009));
      arr = { x: ev.clientX, y: ev.clientY };
      pinta();
    });
    const fin = () => { arr = null; cv.classList.remove('arrastrando'); };
    cv.addEventListener('pointerup', fin); cv.addEventListener('pointercancel', fin);
    cv.addEventListener('dblclick', () => { st.yaw = ini.yaw; st.pitch = ini.pitch; pinta(); });
    /* los clics en la figura no pasan página */
    box.addEventListener('click', ev => ev.stopPropagation());
    box.addEventListener('dblclick', ev => ev.stopPropagation());
    poner();
  });
}

/* ===================================================================== */
const OPCIONES_MATE = {
  delimiters: [
    {left: "$$", right: "$$", display: true},
    {left: "$",  right: "$",  display: false}
  ],
  throwOnError: false
};
const $ = id => document.getElementById(id);
function mate(el) { if (window.renderMathInElement) renderMathInElement(el, OPCIONES_MATE); }

/* ---------------------------------------------------------------------
   MOTOR DEL LIBRO
   - Cada ejercicio se trocea en "unidades" (un párrafo, una fórmula, una
     matriz...). Cada clic escribe la siguiente unidad.
   - Las unidades se reparten en páginas de tamaño fijo (como un libro).
     Cada valor crítico ("Si a = ...") empieza en página nueva.
   - Se ven dos páginas. Cuando se llena la de la derecha, pasa a ser la
     de la izquierda y aparece una página nueva a la derecha.
   --------------------------------------------------------------------- */
const LW = 800;                     // ancho lógico de una página (px)
let actual = 0;                     // ejercicio activo
let s = 0;                          // unidades escritas
let G = {};                         // geometría
let libro = null;                   // {unidades, paginas}
let Lprev = 0;

function geometria() {
  const W = $("libro").clientWidth, H = $("libro").clientHeight;
  const Sw = W / 2, k = (Sw - 20) / LW;
  G = { W, H, Sw, k, LH: (H - 20) / k };
}

/* trocea un ejercicio en secciones y unidades (se hace una sola vez) */
function extraer(e) {
  if (e._sec) return e._sec;
  const stage = $("stage"), secs = [];
  const add = (tipo, cab, html, salto, mismo) => {
    const d = document.createElement("div");
    d.innerHTML = html;
    stage.appendChild(d);
    mate(d);
    initFiguras(d);
    const unidades = [];
    d.childNodes.forEach(n => {
      if (n.nodeType === 1) unidades.push(n);
      else if (n.nodeType === 3 && n.textContent.trim()) {
        const sp = document.createElement("span"); sp.textContent = n.textContent; unidades.push(sp);
      }
    });
    let cabHTML = null;
    if (cab) { const c = document.createElement("div"); c.innerHTML = cab; mate(c); cabHTML = c.innerHTML; }
    secs.push({ tipo, cabHTML, unidades, salto: !!salto, mismo: !!mismo });
  };
  add("titulo", null, "<h1>" + e.titulo + "</h1>");
  add("enun", null, e.enunciado, false, true);      // título y enunciado salen juntos con un clic
  e.pasos.forEach(p => add(p.caja ? "caja" : "paso", p.caja || p.titulo, p.html, p.caja && /^Si /.test(p.caja)));
  stage.innerHTML = "";
  /* un "tic" = un clic. Cada sección es un bloque; dentro de una fila de menores
     (.fila-menores) cada .sub sale con su propio clic */
  let base = 0;
  secs.forEach(sc => {
    let cur = sc.mismo ? base : base + 1, nuevo = false;
    sc.unidades = sc.unidades.map(n => {
      if (nuevo) { cur++; nuevo = false; }
      const o = { n, t: cur, subs: [] };
      if (n.classList && n.classList.contains("fila-menores")) {
        n.querySelectorAll(".sub").forEach(sb => { cur++; o.subs.push({ n: sb, t: cur }); });
        nuevo = true;
      }
      return o;
    });
    base = cur;
  });
  e._T = base;
  e._sec = secs;
  return secs;
}

function crearCont(sc, sigue) {
  const c = document.createElement("div");
  c.className = "cont";
  if (sc.tipo === "caja") {
    c.classList.add("caja");
    if (!sigue) c.insertAdjacentHTML("afterbegin", '<span class="titulo">' + sc.cabHTML + "</span>");
  } else if (sc.tipo === "paso") {
    c.classList.add("paso");
    if (!sigue) c.insertAdjacentHTML("afterbegin", "<h4>" + sc.cabHTML + "</h4>");
  } else if (sc.tipo === "enun") {
    c.classList.add("caja", "enunciado");
  }
  if (sigue) c.classList.add("sigue");
  return c;
}

/* una fórmula más ancha que la página se reduce hasta caber */
function ajustar(u) {
  if (u.classList && u.classList.contains("fila-menores")) {
    u.style.zoom = "";
    if (u.scrollWidth > u.clientWidth + 2) u.style.zoom = String(Math.max(.55, u.clientWidth / u.scrollWidth * .97));
  }
  u.querySelectorAll(".katex-display").forEach(d => {
    const k = d.firstElementChild;
    if (!k) return;
    k.style.zoom = "";
    if (d.scrollWidth > d.clientWidth + 2) k.style.zoom = String(Math.max(.55, d.clientWidth / d.scrollWidth * .98));
  });
}

/* reparte las unidades en páginas del tamaño actual */
function paginar(secs, T) {
  secs.T = T;
  const pista = $("pista");
  pista.innerHTML = "";
  const paginas = [], unidades = [];
  const nueva = () => {
    const hoja = document.createElement("div");
    hoja.className = "hoja";
    hoja.style.cssText = "left:" + (paginas.length * G.Sw) + "px;width:" + G.Sw + "px;height:" + G.H + "px";
    const pag = document.createElement("div");
    pag.className = "pag";
    pag.style.cssText = "width:" + LW + "px;height:" + G.LH + "px;transform:scale(" + G.k + ")";
    const cu = document.createElement("div");
    cu.className = "cuerpo";
    cu.style.height = (G.LH - 34 - 56) + "px";
    const num = document.createElement("div");
    num.className = "num"; num.textContent = paginas.length + 1;
    pag.append(cu, num); hoja.appendChild(pag); pista.appendChild(hoja);
    const o = { hoja, cu };
    paginas.push(o);
    return o;
  };
  let pg = nueva();
  const desborda = () => pg.cu.scrollHeight > pg.cu.clientHeight + 1;
  secs.forEach(sc => {
    if (sc.salto && pg.cu.children.length) pg = nueva();
    let cont = crearCont(sc, false), puestas = 0;
    pg.cu.appendChild(cont);
    /* un bloque (lo que sale con un clic) nunca se parte entre dos páginas */
    const bloques = [];
    sc.unidades.forEach(un => {
      const ult = bloques[bloques.length - 1];
      if (ult && ult[0].t === un.t) ult.push(un); else bloques.push([un]);
    });
    bloques.forEach(bl => {
      bl.forEach(un => {
        un.n.classList.add("u"); un.n.classList.remove("on");
        un.subs.forEach(sb => { sb.n.classList.add("u"); sb.n.classList.remove("on"); });
        cont.appendChild(un.n);
      });
      bl.forEach(un => ajustar(un.n));
      if (desborda()) {
        bl.forEach(un => cont.removeChild(un.n));
        if (!puestas) pg.cu.removeChild(cont);
        if (pg.cu.children.length) pg = nueva();     // página nueva solo si la actual ya tiene algo
        cont = crearCont(sc, puestas > 0);
        pg.cu.appendChild(cont);
        bl.forEach(un => cont.appendChild(un.n));
        bl.forEach(un => ajustar(un.n));
      }
      puestas += bl.length;
      const pi = paginas.indexOf(pg);
      bl.forEach(un => {
        unidades.push({ u: un.n, cont, pag: pi, t: un.t, on: false });
        un.subs.forEach(sb => unidades.push({ u: sb.n, cont, pag: pi, t: sb.t, on: false }));
      });
    });
  });
  libro = { unidades, paginas, T: secs.T };
}

/* pone al día lo que se ve según s */
function aplicar(anim) {
  const U = libro.unidades;
  s = Math.max(0, Math.min(s, libro.T));
  const conts = new Map();
  U.forEach((o, i) => {
    const on = o.t <= s;
    if (on !== o.on) {
      o.on = on;
      if (on) { o.u.classList.remove("rapido"); o.u.classList.add("on"); }
      else { o.u.classList.add("rapido"); o.u.classList.remove("on"); }
    }
    if (on) conts.set(o.cont, true); else if (!conts.has(o.cont)) conts.set(o.cont, false);
  });
  conts.forEach((v, c) => {
    if (v) { c.classList.remove("rapido"); c.classList.add("on"); }
    else { c.classList.add("rapido"); c.classList.remove("on"); }
  });
  let p = 0;
  U.forEach(o => { if (o.t <= s) p = Math.max(p, o.pag); });
  const L = Math.max(p - 1, 0);
  const pista = $("pista");
  pista.classList.toggle("anim", !!anim);
  pista.style.transform = "translateX(" + (-L * G.Sw) + "px)";
  if (anim && L > Lprev) {
    const h = libro.paginas[p].hoja;
    h.classList.remove("gira"); void h.offsetWidth; h.classList.add("gira");
    setTimeout(() => h.classList.remove("gira"), 1000);
  }
  Lprev = L;
  const n = libro.T;
  $("contador").textContent = EJERCICIOS[actual].titulo + " · " + s + " / " + n;
  $("relleno").style.width = (n ? s / n * 100 : 0) + "%";
  $("btnAtras").disabled = (actual === 0 && s <= 1);
  $("btnAdelante").disabled = (actual === EJERCICIOS.length - 1 && s === n);
}

function pintarPestanas() {
  const nav = $("pestanas");
  nav.innerHTML = "";
  EJERCICIOS.forEach((e, i) => {
    const b = document.createElement("button");
    b.textContent = e.titulo.replace("Ejercicio ", "Ej. ");
    b.setAttribute("aria-selected", i === actual);
    b.onclick = ev => { ev.stopPropagation(); cargar(i, false); };
    nav.appendChild(b);
  });
  const sel = nav.querySelector('[aria-selected="true"]');
  if (sel) sel.scrollIntoView({ inline: "center", block: "nearest" });
}

function construir() {
  geometria();
  const e = EJERCICIOS[actual];
  const secs = extraer(e);
  paginar(secs, e._T);
}

async function cargar(i, alFinal) {
  const lib = $("libro");
  lib.classList.add("fuera");
  await new Promise(r => setTimeout(r, 200));
  actual = i;
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
  construir();
  s = alFinal ? libro.T : 1;          // al abrir un ejercicio ya se ve el enunciado
  Lprev = 0;
  pintarPestanas();
  aplicar(false);
  lib.classList.remove("fuera");
}

function avanzar() {
  if (s < libro.T) { s++; aplicar(true); }
  else if (actual < EJERCICIOS.length - 1) cargar(actual + 1, false);
}
function retroceder() {
  if (s > 1) { s--; aplicar(true); }
  else if (actual > 0) cargar(actual - 1, true);
}

/* clic: tercio izquierdo = atrás; resto = adelante */
$("libro").addEventListener("click", ev => {
  if (String(window.getSelection())) return;
  if (ev.clientX < window.innerWidth / 3) retroceder(); else avanzar();
});
$("btnAtras").onclick = ev => { ev.stopPropagation(); retroceder(); };
$("btnAdelante").onclick = ev => { ev.stopPropagation(); avanzar(); };
$("tira").onclick = ev => {
  ev.stopPropagation();
  const r = $("tira").getBoundingClientRect();
  s = Math.max(1, Math.round((ev.clientX - r.left) / r.width * libro.T));
  aplicar(true);
};
document.addEventListener("keydown", ev => {
  if (["ArrowRight", "PageDown", " ", "Enter"].includes(ev.key)) { ev.preventDefault(); avanzar(); }
  else if (["ArrowLeft", "PageUp", "Backspace"].includes(ev.key)) { ev.preventDefault(); retroceder(); }
  else if (ev.key === "Home") { s = 1; aplicar(true); }
  else if (ev.key === "End") { s = libro.T; aplicar(true); }
});
let tRes = null;
window.addEventListener("resize", () => {
  clearTimeout(tRes);
  tRes = setTimeout(() => { if (libro) { construir(); Lprev = 0; aplicar(false); } }, 150);
});

window.addEventListener("load", () => cargar(0, false));
if (document.fonts && document.fonts.addEventListener) document.fonts.addEventListener("loadingdone", () => {
  clearTimeout(tRes);
  tRes = setTimeout(() => { if (libro) { construir(); aplicar(false); } }, 60);
});
</script>
</body>
