<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intervalos: unión e intersección</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<style>
  :root{
    --texto:#111; --verde-fondo:#E5FFE5; --verde-borde:#80FF80; --verde-titulo:#5CD65C;
    --azul:#1414E6; --rojo:#E01E1E; --gris:#666;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;color:var(--texto);cursor:pointer;
    font-family:"Latin Modern Roman","CMU Serif","Computer Modern Serif","Palatino Linotype",Palatino,Georgia,serif;
    font-size:20px;line-height:1.55;-webkit-tap-highlight-color:transparent}

  html,body{overflow:hidden}
  body{background:#fff}

  /* barra superior */
  .barra-sup{position:fixed;top:0;left:0;right:0;height:46px;z-index:5;background:#fff;border-bottom:1px solid #ddd;
    padding:0 14px;display:flex;gap:14px;align-items:center;font-size:.85rem;color:var(--gris)}
  .barra-sup .tit{font-weight:bold;color:#333;white-space:nowrap}
  .pestanas{display:flex;gap:6px;margin-left:auto;overflow-x:auto;scrollbar-width:none;padding:2px 0}
  .pestanas::-webkit-scrollbar{display:none}
  .pestanas button{font:inherit;font-size:.85rem;padding:3px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;
    background:#fff;border:1.5px solid #333;color:#333}
  .pestanas button[aria-selected="true"]{background:#333;color:#fff}

  /* barra inferior: botones grandes (pizarra digital) y progreso */
  .progreso{position:fixed;left:0;right:0;bottom:0;height:52px;z-index:5;background:#fff;border-top:1px solid #ddd;
    display:flex;align-items:center;gap:14px;padding:0 14px;font-size:.85rem;color:var(--gris)}
  .progreso .tira{flex:1;height:10px;background:#e8e8e8;border-radius:5px;overflow:hidden;cursor:pointer}
  .progreso .tira i{display:block;height:100%;background:#2e9e2e;transition:width .35s ease}
  .progreso .nav{font:inherit;font-size:1.5rem;line-height:1;width:64px;height:38px;border-radius:10px;cursor:pointer;
    background:#fff;border:2px solid #2e9e2e;color:#2e9e2e}
  .progreso .nav:active{background:#2e9e2e;color:#fff}
  .progreso .nav:disabled{opacity:.3;cursor:default}
  #contador{min-width:9.5em;text-align:right;white-space:nowrap}

  /* el libro: dos páginas, separadas solo por una línea fina */
  #libro{position:fixed;left:0;right:0;top:46px;bottom:52px;overflow:hidden;background:#fff;transition:opacity .25s ease}
  #libro.fuera{opacity:0}
  #pista{position:absolute;left:0;top:0;height:100%;will-change:transform}
  #pista.anim{transition:transform .9s cubic-bezier(.65,.05,.25,1)}
  .hoja{position:absolute;top:0;padding:6px 8px}
  .pag{position:relative;background:#fff;transform-origin:0 0;padding:30px 40px 0}
  .pag .cuerpo{display:flow-root;overflow:hidden}
  .pag .num{position:absolute;left:0;right:0;bottom:12px;text-align:center;color:#bbb;font-size:.8rem}
  #lomo{position:absolute;left:50%;top:14px;bottom:14px;width:0;border-left:1px solid #c9c9c9;pointer-events:none;z-index:2}
  .hoja.gira .pag{animation:gira .9s ease both}
  @keyframes gira{from{opacity:0}to{opacity:1}}
  @media (prefers-reduced-motion:reduce){#pista.anim{transition:none}.hoja.gira .pag{animation:none}}

  /* lo que se va escribiendo */
  .cont{opacity:0;transition:opacity .35s ease}
  .cont.on{opacity:1}
  .u{opacity:0;clip-path:inset(-40px 100% -40px -40px);transition:opacity .25s ease,clip-path .85s ease}
  span.u{display:block}
  .u.on{opacity:1;clip-path:inset(-40px -40px -40px -40px)}
  .u.rapido,.cont.rapido{transition:none}
  .cont.sigue{margin-top:0;padding-top:14px;border-top-left-radius:0;border-top-right-radius:0}
  .fila-menores{display:flex;justify-content:space-around;align-items:center;gap:.4em;margin:.8em 0}
  .fila-menores .sub{display:block}
  .fila-menores.col{flex-direction:column;align-items:center;gap:.1em;margin:.4em 0}
  h1{margin:0 0 6px;font-size:2.1rem;line-height:1.2}
  h4{margin:16px 0 6px;font-size:1.18rem}

  /* cajas verdes del modelo */
  .caja{position:relative;background:var(--verde-fondo);border:1.5px solid var(--verde-borde);
    border-radius:8px;padding:20px 20px 10px;margin:26px 0 14px}
  .caja>.titulo{position:absolute;top:-13px;left:12px;background:var(--verde-titulo);color:#fff;
    font-weight:bold;padding:1px 12px;border-radius:5px;font-size:.92rem}
  .caja.enunciado{color:var(--azul);margin-top:6px;padding-top:12px}
  .caja p{margin:.3em 0 .5em}
  .paso{margin:6px 0 10px}

  /* matrices con menores marcados en caja roja */
  .ec{display:flex;align-items:center;justify-content:center;gap:.5em;margin:.6em 0;flex-wrap:wrap}
  .mat{--w:2.5em;--h:1.7em;position:relative;display:inline-grid;
    grid-template-columns:repeat(var(--nc),var(--w));grid-auto-rows:var(--h);
    margin:1.1em .7em .2em;text-align:center}
  .mat .c{display:flex;align-items:center;justify-content:center;white-space:nowrap}
  .mat::before,.mat::after{content:"";position:absolute;top:-.15em;bottom:-.15em;width:.55em;border:2px solid #111}
  .mat::before{left:-.7em;border-right:0;border-radius:60% 0 0 60%/50% 0 0 50%}
  .mat::after{right:-.7em;border-left:0;border-radius:0 60% 60% 0/0 50% 50% 0}
  .mat .bar{position:absolute;top:.1em;bottom:.1em;left:calc(var(--k) * var(--w));border-left:1.5px solid #111}
  .mat .caja-roja{position:absolute;border:1.5px solid var(--rojo);pointer-events:none;
    left:calc(var(--c0) * var(--w) + .15em);top:calc(var(--r0) * var(--h) + .12em);
    width:calc(var(--cs) * var(--w) - .3em);height:calc(var(--rs) * var(--h) - .24em)}
  .mat .caja-roja i{position:absolute;left:50%;top:-1.35em;transform:rotate(-40deg);transform-origin:left bottom;
    color:var(--rojo);font-style:normal;white-space:nowrap}
  .mat .tacha{position:absolute;left:-.2em;right:-.2em;top:calc((var(--r) + .5) * var(--h));
    border-top:1.5px solid var(--rojo);pointer-events:none}
  .mat .etq{position:absolute;left:calc((var(--c) + .5) * var(--w));top:-.15em;width:0;height:0;pointer-events:none}
  .mat .etq i{position:absolute;left:0;bottom:0;transform:rotate(-40deg);transform-origin:left bottom;
    color:var(--rojo);font-style:normal;white-space:nowrap}
  .instr{color:var(--azul);border:1.5px solid #E6C200;border-radius:14px;padding:6px 16px;margin:10px 0;text-align:center}
  .nota{color:var(--gris);font-size:.9em}
  b.res{color:var(--rojo)}
  .katex-display{margin:.6em 0;overflow-x:auto;overflow-y:hidden}
  table.res{border-collapse:collapse;margin:6px auto 8px}
  table.res th,table.res td{padding:5px 16px;text-align:center}
  table.res th{border-bottom:1.5px solid #111}
  table.res td:not(:last-child),table.res th:not(:last-child){border-right:1px solid #111}
  table.res td:last-child,table.res th:last-child{text-align:left}

  /* ---- añadidos para estas páginas ---- */
  svg.recta{display:block;width:100%;max-width:740px;height:auto;margin:.2em auto}
  .ec svg.recta{flex:1 1 100%}
  table.res td.i,table.res th.i{text-align:center}
  body.inter{cursor:default}
  .inter{color:#111}
  .inter p{margin:.4em 0}
  .inter .resp{display:flex;align-items:center;gap:.6em;margin:.55em 0;flex-wrap:wrap}
  .inter label{min-width:4.6em;text-align:right}
  .inter input{font:inherit;font-size:1.05rem;width:19em;max-width:100%;padding:3px 10px;border:2px solid var(--verde-borde);
    border-radius:8px;background:#fff;color:#111;cursor:text}
  .inter input:focus{outline:none;border-color:var(--verde-titulo);box-shadow:0 0 0 3px #e5ffe5}
  .inter input.ok{background:#e9fbe9;border-color:#2e9e2e}
  .inter input.mal{background:#fff1f1;border-color:var(--rojo)}
  .inter .fb{font-size:.95em}
  .inter .fb.ok{color:#1b7a1b}
  .inter .fb.mal{color:var(--rojo)}
  .inter .acciones{display:flex;align-items:center;gap:1em;margin:.7em 0 .3em}
  .inter button{font:inherit;font-size:1rem;padding:4px 18px;border-radius:999px;cursor:pointer;background:#2e9e2e;border:0;color:#fff}
  .inter button:disabled{opacity:.4;cursor:default}
  .inter .intentos{color:var(--gris);font-size:.9em}
  .inter .pista{color:var(--azul);margin:.3em 0}
  .inter .caja{margin-top:24px}
  #puntos{color:#2e7d2e;font-weight:bold;white-space:nowrap;font-size:.85rem}
</style>
</head>
<body>
<div class="barra-sup">
  <span class="tit">Intervalos: unión e intersección</span>
  <span id="puntos"></span>
  <nav class="pestanas" id="pestanas" aria-label="Ejercicios"></nav>
</div>
<div id="libro"><div id="pista"></div><div id="lomo"></div></div>
<div id="stage" style="position:absolute;left:-99999px;top:0;width:720px;visibility:hidden"></div>
<div class="progreso">
  <button class="nav" id="btnAtras" title="Retroceder (←)">‹</button>
  <button class="nav" id="btnAdelante" title="Avanzar (→)">›</button>
  <div class="tira" id="tira"><i id="relleno"></i></div>
  <span id="contador"></span>
</div>

<script>

const ec = (...partes) => '<div class="ec">' + partes.join('') + '</div>';
const f = s => '<span>$' + s + '$</span>';
const q = Math.sqrt, c3 = Math.cbrt, pw = Math.pow;
/* número con coma decimal, listo para KaTeX */
const D = (x, n = 3) => String(+x.toFixed(n)).replace('.', '{,}');
/* comprobación numérica: se calcula en el navegador con las dos expresiones */
const chk = (l, vl, r, vr, n = 3) => '<p class="nota">Comprobación con la calculadora: $' + l + '\\approx ' + D(vl, n) +
  '$ y $' + r + '\\approx ' + D(vr, n) + '$.</p>';

/* =====================================================================
   INTERVALOS: dibujo de la recta, analizador de respuestas y ejercicios
   ===================================================================== */
const COL = {A: '#1414E6', B: '#D9730D', R: '#1f9d3a'};
const IV = (lo, hi, lc, hc, etq, col, res, mas) => ({lo, hi, lc, hc, etq, col, res, mas});
const menos = v => String(v).replace('-', '−');
const tri = (x, y, dir, c) => '<polygon points="' + x + ',' + y + ' ' + (x - dir * 12) + ',' + (y - 6) + ' ' + (x - dir * 12) + ',' + (y + 6) + '" fill="' + c + '"/>';
const circ = (x, y, c, cerrado) => '<circle cx="' + x + '" cy="' + y + '" r="7.5" fill="' + (cerrado ? c : '#fff') + '" stroke="' + c + '" stroke-width="3"/>';

/* recta real con intervalos dibujados: o = {min, max, guias:[valores], filas:[IV...]} */
function recta(o) {
  const W = 760, L = 66, Rr = 26, rowH = 42, top = 14;
  const n = o.filas.length, yAx = top + n * rowH + 8, H = yAx + 36;
  const X = v => L + (v - o.min) / (o.max - o.min) * (W - L - Rr);
  const xmin = L - 20, xmax = W - Rr + 20;
  let s = '<svg class="recta" viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg" font-family="inherit">';
  (o.guias || []).forEach(v => {
    s += '<line x1="' + X(v) + '" x2="' + X(v) + '" y1="' + top + '" y2="' + yAx + '" stroke="#bdbdbd" stroke-width="1.3" stroke-dasharray="4 4"/>';
  });
  s += '<line x1="' + xmin + '" x2="' + xmax + '" y1="' + yAx + '" y2="' + yAx + '" stroke="#111" stroke-width="1.8"/>' +
       tri(xmin, yAx, -1, '#111') + tri(xmax, yAx, 1, '#111');
  for (let v = Math.ceil(o.min); v <= o.max; v++) {
    s += '<line x1="' + X(v) + '" x2="' + X(v) + '" y1="' + (yAx - 5) + '" y2="' + (yAx + 5) + '" stroke="#111" stroke-width="1.5"/>' +
         '<text x="' + X(v) + '" y="' + (yAx + 24) + '" text-anchor="middle" font-size="18" fill="#111">' + menos(v) + '</text>';
  }
  o.filas.forEach((r, i) => {
    const y = top + i * rowH + rowH / 2, c = r.col || COL.A, w = r.res ? 8 : 5.5;
    if (r.etq) s += '<text x="8" y="' + (y + 7) + '" font-size="21" font-style="italic" font-weight="bold" fill="' + c + '">' + r.etq + '</text>';
    [r].concat(r.mas || []).forEach(t => {
      const xl = t.lo === -Infinity ? xmin : X(t.lo), xr = t.hi === Infinity ? xmax : X(t.hi);
      if (xr > xl) s += '<line x1="' + xl + '" x2="' + xr + '" y1="' + y + '" y2="' + y + '" stroke="' + c + '" stroke-width="' + w + '"/>';
      if (t.lo === -Infinity) s += tri(xl, y, -1, c); else s += circ(xl, y, c, t.lc);
      if (t.hi === Infinity) s += tri(xr, y, 1, c); else if (t.hi !== t.lo) s += circ(xr, y, c, t.hc);
    });
  });
  return s + '</svg>';
}
const R = (min, max, filas, guias) => ec(recta({min, max, filas, guias}));

/* ---------------------------------------------------------------------
   Analizador de lo que escribe el alumno
   --------------------------------------------------------------------- */
const MSG_FORMA = 'Escribe cada intervalo con corchete o paréntesis en los dos extremos, por ejemplo [1, 3) o (-inf, 2].';
function numTok(t) {
  if (t === 'inf' || t === '+inf') return Infinity;
  if (t === '-inf') return -Infinity;
  const m = t.match(/^([+-]?\d+)\/(\d+)$/);
  if (m) return +m[2] ? +m[1] / +m[2] : NaN;
  t = t.replace(',', '.');
  return /^[+-]?(\d+\.?\d*|\.\d+)$/.test(t) ? parseFloat(t) : NaN;
}
function parsear(str) {
  const s = String(str).toLowerCase().replace(/[−–—]/g, '-').replace(/∞/g, 'inf')
    .replace(/infinito|infinity/g, 'inf').replace(/\s+/g, '');
  if (!s) return {ok: false, msg: 'Escribe una respuesta.'};
  if (/^(∅|vacio|vacío|\{\}|conjuntovacio|conjuntovacío|ninguno)$/.test(s)) return {ok: true, ivs: []};
  if (/^(r|ℝ|reales)$/.test(s)) return {ok: true, ivs: [{lo: -Infinity, hi: Infinity, lc: false, hc: false}]};
  const ivs = [];
  let infCerrado = false;
  for (const p of s.split(/u|∪/)) {
    if (!p) return {ok: false, msg: MSG_FORMA};
    let m = p.match(/^\{(.+)\}$/);
    if (m) {
      const v = numTok(m[1]);
      if (!isFinite(v)) return {ok: false, msg: 'Dentro de las llaves va un número, por ejemplo {3}.'};
      ivs.push({lo: v, hi: v, lc: true, hc: true});
      continue;
    }
    m = p.match(/^([\[\(\]])(.+)([\]\)\[])$/);
    if (!m) return {ok: false, msg: MSG_FORMA};
    const t = m[2].split(m[2].includes(';') ? ';' : ',');
    if (t.length !== 2) return {ok: false, msg: MSG_FORMA};
    const lo = numTok(t[0]), hi = numTok(t[1]);
    if (isNaN(lo) || isNaN(hi)) return {ok: false, msg: 'No reconozco los números. Usa cifras, o inf para infinito.'};
    if (lo === Infinity || hi === -Infinity || lo > hi) return {ok: false, msg: 'El extremo izquierdo debe ser menor que el derecho.'};
    const lc = m[1] === '[', hc = m[3] === ']';
    if ((lo === -Infinity && lc) || (hi === Infinity && hc)) infCerrado = true;
    ivs.push({lo, hi, lc: lo === -Infinity ? false : lc, hc: hi === Infinity ? false : hc});
  }
  return {ok: true, ivs, infCerrado};
}
/* forma canónica: ordena y une los trozos que se tocan sin dejar hueco */
function canon(ivs) {
  const a = ivs.filter(v => v.lo < v.hi || (v.lo === v.hi && v.lc && v.hc)).map(v => Object.assign({}, v));
  a.sort((x, y) => x.lo < y.lo ? -1 : x.lo > y.lo ? 1 : (x.lc === y.lc ? 0 : x.lc ? -1 : 1));
  const out = [];
  a.forEach(v => {
    const L = out[out.length - 1];
    if (L && (v.lo < L.hi || (v.lo === L.hi && (L.hc || v.lc)))) {
      if (v.hi > L.hi) { L.hi = v.hi; L.hc = v.hc; } else if (v.hi === L.hi) L.hc = L.hc || v.hc;
    } else out.push(v);
  });
  return out;
}
const igual = (a, b) => a.length === b.length && a.every((v, i) => v.lo === b[i].lo && v.hi === b[i].hi && !!v.lc === !!b[i].lc && !!v.hc === !!b[i].hc);
const tx = v => v === Infinity ? '+∞' : v === -Infinity ? '−∞' : String(+v.toFixed(4)).replace('-', '−').replace('.', ',');
function bonito(ivs) {
  if (!ivs.length) return '∅';
  if (ivs.length === 1 && ivs[0].lo === -Infinity && ivs[0].hi === Infinity) return '(−∞, +∞) = ℝ';
  return ivs.map(v => v.lo === v.hi ? '{' + tx(v.lo) + '}' : (v.lc ? '[' : '(') + tx(v.lo) + ', ' + tx(v.hi) + (v.hc ? ']' : ')')).join(' ∪ ');
}
const texN = v => v === Infinity ? '+\\infty' : v === -Infinity ? '-\\infty' : String(v);
const texIv = v => v.lo === v.hi ? '\\{' + texN(v.lo) + '\\}' : (v.lc ? '[' : '(') + texN(v.lo) + ',\\,' + texN(v.hi) + (v.hc ? ']' : ')');

/* ---------------------------------------------------------------------
   Ejercicios interactivos
   --------------------------------------------------------------------- */
const PRACT = [
  {A: '[-2,4)', B: '(1,6]', U: '[-2,6]', I: '(1,4)', min: -4, max: 8,
   pista: 'Para la intersección mira los extremos 1 y 4: ¿pertenecen a los dos intervalos a la vez?',
   expl: 'A ∩ B empieza en 1 (no está en B: paréntesis) y acaba en 4 (no está en A: paréntesis). A ∪ B empieza en −2 (está en A: corchete) y acaba en 6 (está en B: corchete), sin huecos.'},
  {A: '(-inf,0]', B: '(-3,2)', U: '(-inf,2)', I: '(-3,0]', min: -5, max: 4,
   pista: 'El infinito siempre lleva paréntesis. Para la unión: ¿está el 2 en alguno de los dos?',
   expl: 'A ∪ B llega hasta 2, que no está en B (paréntesis) ni en A. A ∩ B empieza en −3 (no está en B: paréntesis) y acaba en 0 (está en A y en B: corchete).'},
  {A: '[0,2]', B: '(2,5)', U: '[0,5)', I: 'vacio', min: -2, max: 7,
   pista: 'Mira el punto 2: ¿está en A? ¿está en B? Piensa si queda un hueco en la unión.',
   expl: 'El 2 está en A pero no en B, y es el único punto donde se tocan: no hay puntos comunes (∅). En la unión no hay hueco porque el 2 sí está (en A): [0, 5).'},
  {A: '(-6,-2)', B: '[-2,1]', U: '(-6,1]', I: 'vacio', min: -8, max: 3,
   pista: 'Mira el punto −2: ¿está en A? ¿está en B?',
   expl: 'El −2 está en B pero no en A: no hay puntos comunes (∅). La unión no tiene hueco porque el −2 sí está (en B): (−6, 1].'},
  {A: '[3,inf)', B: '(-inf,3)', U: '(-inf,inf)', I: 'vacio', min: -2, max: 8,
   pista: 'Los dos intervalos se tocan en el 3. ¿Falta algún punto en la unión? Para toda la recta puedes escribir R o (-inf, inf).',
   expl: 'El 3 está en A, así que no falta ningún punto: la unión es toda la recta, ℝ. No hay puntos comunes porque el 3 no está en B.'},
  {A: '(-4,3]', B: '[3,7)', U: '(-4,7)', I: '{3}', min: -6, max: 9,
   pista: 'Los dos intervalos comparten el extremo 3. ¿Está en los dos? Un solo punto se escribe entre llaves: {3}.',
   expl: 'El 3 está en A (corchete) y en B (corchete): es el único punto común, A ∩ B = {3}. La unión no tiene hueco: (−4, 7).'},
  {A: '[-5,-2]', B: '(0,4]', U: '[-5,-2]U(0,4]', I: 'vacio', min: -7, max: 6,
   pista: 'Entre −2 y 0 no hay nada dibujado. Si la unión no es un único intervalo, escribe los dos trozos con U.',
   expl: 'Los intervalos no se tocan: A ∩ B = ∅. La unión no se puede escribir como un solo intervalo: [−5, −2] ∪ (0, 4].'},
  {A: '(-1,5)', B: '[1,3]', U: '(-1,5)', I: '[1,3]', min: -3, max: 7,
   pista: 'B está completamente dentro de A. ¿Qué intervalo es la unión? ¿Y la intersección?',
   expl: 'Como B está dentro de A, A ∪ B = A = (−1, 5) y A ∩ B = B = [1, 3].'}
];
let ACIERTOS = 0;
function puntos() { const e = document.getElementById('puntos'); if (e) e.textContent = 'Aciertos: ' + ACIERTOS + ' / ' + PRACT.length * 2; }

function widget(p, k) {
  const a = parsear(p.A).ivs[0], b = parsear(p.B).ivs[0];
  const guias = [a.lo, a.hi, b.lo, b.hi].filter(isFinite);
  const svg = recta({min: p.min, max: p.max, guias, filas: [Object.assign({etq: 'A', col: COL.A}, a), Object.assign({etq: 'B', col: COL.B}, b)]});
  const campo = (id, tex) => '<div class="resp"><label>$' + tex + '=$</label>' +
    '<input type="text" data-in="' + id + '" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="p. ej. [-2, 6)">' +
    '<span class="fb"></span></div>';
  return '<div class="inter" data-k="' + k + '">' +
    '<p>En la recta están dibujados los intervalos $A=' + texIv(a) + '$ y $B=' + texIv(b) + '$. Calcula:</p>' +
    '<div class="ec">' + svg + '</div>' +
    campo('u', 'A\\cup B') + campo('i', 'A\\cap B') +
    '<div class="acciones"><button type="button" data-chk>Comprobar</button><span class="intentos">Intento 1 de 2</span></div>' +
    '<div class="pista"></div>' +
    '<p class="nota">Cómo escribir: <b>inf</b> para ∞ (por ejemplo <b>(-inf, 3]</b>), <b>U</b> para la unión, ' +
    '<b>vacio</b> si no hay ningún punto, <b>{3}</b> para un solo punto y <b>R</b> para toda la recta.</p>' +
    '<div class="sol"></div></div>';
}

function comprobar(w) {
  if (w.dataset.fin) return;
  const p = PRACT[+w.dataset.k];
  const campos = [['u', p.U], ['i', p.I]].map(([id, esp]) => {
    const inp = w.querySelector('input[data-in="' + id + '"]');
    return {id, esp: canon(parsear(esp).ivs), inp, fb: inp.parentNode.querySelector('.fb'), hecho: inp.disabled};
  });
  const activos = campos.filter(c => !c.hecho);
  /* 1) ¿se entiende lo escrito? Si no, no se gasta el intento */
  let hayError = false;
  activos.forEach(c => {
    c.r = parsear(c.inp.value);
    c.fb.className = 'fb';
    c.fb.textContent = '';
    if (!c.r.ok) { hayError = true; c.fb.className = 'fb mal'; c.fb.textContent = c.r.msg; c.inp.classList.add('mal'); }
  });
  if (hayError) return;
  /* 2) corrección */
  const n = (+w.dataset.n || 0) + 1;
  w.dataset.n = n;
  const malos = [];
  activos.forEach(c => {
    const mio = canon(c.r.ivs);
    if (!c.r.infCerrado && igual(mio, c.esp)) {
      c.inp.classList.remove('mal'); c.inp.classList.add('ok'); c.inp.disabled = true;
      c.fb.className = 'fb ok';
      c.fb.textContent = '✔ Correcto' + (mio.length < c.r.ivs.length ? ' (se puede escribir más corto: ' + bonito(mio) + ')' : '');
      ACIERTOS++;
    } else {
      c.inp.classList.add('mal');
      c.fb.className = 'fb mal';
      c.fb.textContent = c.r.infCerrado ? '✘ Junto a ∞ siempre va paréntesis.' : '✘ No es correcto';
      malos.push(c);
    }
  });
  puntos();
  const btn = w.querySelector('button[data-chk]'), info = w.querySelector('.intentos');
  const termina = (titulo, lineas) => {
    w.dataset.fin = '1';
    btn.disabled = true;
    w.querySelectorAll('input').forEach(i => { i.disabled = true; });
    w.querySelector('.pista').innerHTML = '';
    w.querySelector('.sol').innerHTML = '<div class="caja"><span class="titulo">' + titulo + '</span>' + lineas + '<p>' + p.expl + '</p></div>';
  };
  if (!malos.length) { info.textContent = '¡Muy bien!'; termina('Explicación', ''); return; }
  if (n >= 2) {
    info.textContent = 'Sin más intentos';
    termina('Solución', malos.map(c => '<p>' + (c.id === 'u' ? 'A ∪ B' : 'A ∩ B') + ' = <b class="res">' + bonito(c.esp) + '</b></p>').join(''));
  } else {
    info.textContent = 'Intento 2 de 2';
    w.querySelector('.pista').innerHTML = '<b>Pista:</b> ' + p.pista;
  }
}
document.addEventListener('click', ev => {
  const b = ev.target.closest && ev.target.closest('button[data-chk]');
  if (b) comprobar(b.closest('.inter'));
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && ev.target.matches && ev.target.matches('.inter input')) { ev.preventDefault(); comprobar(ev.target.closest('.inter')); }
});
window.addEventListener('load', puntos);

  delimiters: [
    {left: "$$", right: "$$", display: true},
    {left: "$",  right: "$",  display: false}
  ],
  throwOnError: false
};
const $ = id => document.getElementById(id);
function mate(el) { if (window.renderMathInElement) renderMathInElement(el, OPCIONES_MATE); }

/* ---------------------------------------------------------------------
   MOTOR DEL LIBRO
   - Cada ejercicio se trocea en "unidades" (un párrafo, una fórmula, una
     matriz...). Cada clic escribe la siguiente unidad.
   - Las unidades se reparten en páginas de tamaño fijo (como un libro).
     Cada valor crítico ("Si a = ...") empieza en página nueva.
   - Se ven dos páginas. Cuando se llena la de la derecha, pasa a ser la
     de la izquierda y aparece una página nueva a la derecha.
   --------------------------------------------------------------------- */
const LW = 800;                     // ancho lógico de una página (px)
let actual = 0;                     // ejercicio activo
let s = 0;                          // unidades escritas
let G = {};                         // geometría
let libro = null;                   // {unidades, paginas}
let Lprev = 0;

function geometria() {
  const W = $("libro").clientWidth, H = $("libro").clientHeight;
  const Sw = W / 2, k = (Sw - 20) / LW;
  G = { W, H, Sw, k, LH: (H - 20) / k };
}

/* trocea un ejercicio en secciones y unidades (se hace una sola vez) */
function extraer(e) {
  if (e._sec) return e._sec;
  const stage = $("stage"), secs = [];
  const add = (tipo, cab, html, salto, mismo) => {
    const d = document.createElement("div");
    d.innerHTML = html;
    stage.appendChild(d);
    mate(d);
    const unidades = [];
    d.childNodes.forEach(n => {
      if (n.nodeType === 1) unidades.push(n);
      else if (n.nodeType === 3 && n.textContent.trim()) {
        const sp = document.createElement("span"); sp.textContent = n.textContent; unidades.push(sp);
      }
    });
    let cabHTML = null;
    if (cab) { const c = document.createElement("div"); c.innerHTML = cab; mate(c); cabHTML = c.innerHTML; }
    secs.push({ tipo, cabHTML, unidades, salto: !!salto, mismo: !!mismo });
  };
  add("titulo", null, "<h1>" + e.titulo + "</h1>");
  add("enun", null, e.enunciado, false, true);      // título y enunciado salen juntos con un clic
  e.pasos.forEach(p => add(p.caja ? "caja" : "paso", p.caja || p.titulo, p.html, p.caja && /^Si /.test(p.caja)));
  stage.innerHTML = "";
  /* un "tic" = un clic. Cada sección es un bloque; dentro de una fila de menores
     (.fila-menores) cada .sub sale con su propio clic */
  let base = 0;
  secs.forEach(sc => {
    let cur = sc.mismo ? base : base + 1, nuevo = false;
    sc.unidades = sc.unidades.map(n => {
      if (nuevo) { cur++; nuevo = false; }
      const o = { n, t: cur, subs: [] };
      if (n.classList && n.classList.contains("fila-menores")) {
        n.querySelectorAll(".sub").forEach(sb => { cur++; o.subs.push({ n: sb, t: cur }); });
        nuevo = true;
      }
      return o;
    });
    base = cur;
  });
  e._T = base;
  e._sec = secs;
  return secs;
}

function crearCont(sc, sigue) {
  const c = document.createElement("div");
  c.className = "cont";
  if (sc.tipo === "caja") {
    c.classList.add("caja");
    if (!sigue) c.insertAdjacentHTML("afterbegin", '<span class="titulo">' + sc.cabHTML + "</span>");
  } else if (sc.tipo === "paso") {
    c.classList.add("paso");
    if (!sigue) c.insertAdjacentHTML("afterbegin", "<h4>" + sc.cabHTML + "</h4>");
  } else if (sc.tipo === "enun") {
    c.classList.add("caja", "enunciado");
  }
  if (sigue) c.classList.add("sigue");
  return c;
}

/* una fórmula más ancha que la página se reduce hasta caber */
function ajustar(u) {
  if (u.classList && u.classList.contains("fila-menores")) {
    u.style.zoom = "";
    if (u.scrollWidth > u.clientWidth + 2) u.style.zoom = String(Math.max(.55, u.clientWidth / u.scrollWidth * .97));
  }
  u.querySelectorAll(".katex-display").forEach(d => {
    const k = d.firstElementChild;
    if (!k) return;
    k.style.zoom = "";
    if (d.scrollWidth > d.clientWidth + 2) k.style.zoom = String(Math.max(.55, d.clientWidth / d.scrollWidth * .98));
  });
}

/* reparte las unidades en páginas del tamaño actual */
function paginar(secs, T) {
  secs.T = T;
  const pista = $("pista");
  pista.innerHTML = "";
  const paginas = [], unidades = [];
  const nueva = () => {
    const hoja = document.createElement("div");
    hoja.className = "hoja";
    hoja.style.cssText = "left:" + (paginas.length * G.Sw) + "px;width:" + G.Sw + "px;height:" + G.H + "px";
    const pag = document.createElement("div");
    pag.className = "pag";
    pag.style.cssText = "width:" + LW + "px;height:" + G.LH + "px;transform:scale(" + G.k + ")";
    const cu = document.createElement("div");
    cu.className = "cuerpo";
    cu.style.height = (G.LH - 34 - 56) + "px";
    const num = document.createElement("div");
    num.className = "num"; num.textContent = paginas.length + 1;
    pag.append(cu, num); hoja.appendChild(pag); pista.appendChild(hoja);
    const o = { hoja, cu };
    paginas.push(o);
    return o;
  };
  let pg = nueva();
  const desborda = () => pg.cu.scrollHeight > pg.cu.clientHeight + 1;
  secs.forEach(sc => {
    if (sc.salto && pg.cu.children.length) pg = nueva();
    let cont = crearCont(sc, false), puestas = 0;
    pg.cu.appendChild(cont);
    /* un bloque (lo que sale con un clic) nunca se parte entre dos páginas */
    const bloques = [];
    sc.unidades.forEach(un => {
      const ult = bloques[bloques.length - 1];
      if (ult && ult[0].t === un.t) ult.push(un); else bloques.push([un]);
    });
    bloques.forEach(bl => {
      bl.forEach(un => {
        un.n.classList.add("u"); un.n.classList.remove("on");
        un.subs.forEach(sb => { sb.n.classList.add("u"); sb.n.classList.remove("on"); });
        cont.appendChild(un.n);
      });
      bl.forEach(un => ajustar(un.n));
      if (desborda()) {
        bl.forEach(un => cont.removeChild(un.n));
        if (!puestas) pg.cu.removeChild(cont);
        if (pg.cu.children.length) pg = nueva();     // página nueva solo si la actual ya tiene algo
        cont = crearCont(sc, puestas > 0);
        pg.cu.appendChild(cont);
        bl.forEach(un => cont.appendChild(un.n));
        bl.forEach(un => ajustar(un.n));
      }
      puestas += bl.length;
      const pi = paginas.indexOf(pg);
      bl.forEach(un => {
        unidades.push({ u: un.n, cont, pag: pi, t: un.t, on: false });
        un.subs.forEach(sb => unidades.push({ u: sb.n, cont, pag: pi, t: sb.t, on: false }));
      });
    });
  });
  libro = { unidades, paginas, T: secs.T };
}

/* pone al día lo que se ve según s */
function aplicar(anim) {
  const U = libro.unidades;
  s = Math.max(0, Math.min(s, libro.T));
  const conts = new Map();
  U.forEach((o, i) => {
    const on = o.t <= s;
    if (on !== o.on) {
      o.on = on;
      if (on) { o.u.classList.remove("rapido"); o.u.classList.add("on"); }
      else { o.u.classList.add("rapido"); o.u.classList.remove("on"); }
    }
    if (on) conts.set(o.cont, true); else if (!conts.has(o.cont)) conts.set(o.cont, false);
  });
  conts.forEach((v, c) => {
    if (v) { c.classList.remove("rapido"); c.classList.add("on"); }
    else { c.classList.add("rapido"); c.classList.remove("on"); }
  });
  let p = 0;
  U.forEach(o => { if (o.t <= s) p = Math.max(p, o.pag); });
  const L = Math.max(p - 1, 0);
  const pista = $("pista");
  pista.classList.toggle("anim", !!anim);
  pista.style.transform = "translateX(" + (-L * G.Sw) + "px)";
  if (anim && L > Lprev) {
    const h = libro.paginas[p].hoja;
    h.classList.remove("gira"); void h.offsetWidth; h.classList.add("gira");
    setTimeout(() => h.classList.remove("gira"), 1000);
  }
  Lprev = L;
  const n = libro.T;
  $("contador").textContent = EJERCICIOS[actual].interactivo ? EJERCICIOS[actual].titulo : EJERCICIOS[actual].titulo + " · " + s + " / " + n;
  $("relleno").style.width = (n ? s / n * 100 : 0) + "%";
  $("btnAtras").disabled = (actual === 0 && s <= 1);
  $("btnAdelante").disabled = (actual === EJERCICIOS.length - 1 && s === n);
}

function pintarPestanas() {
  const nav = $("pestanas");
  nav.innerHTML = "";
  EJERCICIOS.forEach((e, i) => {
    const b = document.createElement("button");
    b.textContent = e.corto || e.titulo.replace("Ejercicio ", "Ej. ");
    b.setAttribute("aria-selected", i === actual);
    b.onclick = ev => { ev.stopPropagation(); cargar(i, false); };
    nav.appendChild(b);
  });
  const sel = nav.querySelector('[aria-selected="true"]');
  if (sel) sel.scrollIntoView({ inline: "center", block: "nearest" });
}

function construir() {
  geometria();
  const e = EJERCICIOS[actual];
  const secs = extraer(e);
  paginar(secs, e._T);
}

async function cargar(i, alFinal) {
  const lib = $("libro");
  lib.classList.add("fuera");
  await new Promise(r => setTimeout(r, 200));
  actual = i;
  document.body.classList.toggle("inter", !!EJERCICIOS[actual].interactivo);
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
  construir();
  s = alFinal ? libro.T : 1;          // al abrir un ejercicio ya se ve el enunciado
  Lprev = 0;
  pintarPestanas();
  aplicar(false);
  lib.classList.remove("fuera");
}

function avanzar() {
  if (s < libro.T) { s++; aplicar(true); }
  else if (actual < EJERCICIOS.length - 1) cargar(actual + 1, false);
}
function retroceder() {
  if (s > 1) { s--; aplicar(true); }
  else if (actual > 0) cargar(actual - 1, true);
}

/* clic: tercio izquierdo = atrás; resto = adelante */
$("libro").addEventListener("click", ev => {
  if (String(window.getSelection())) return;
  if (EJERCICIOS[actual].interactivo || ev.target.closest("input,button,a,.inter")) return;
  if (ev.clientX < window.innerWidth / 3) retroceder(); else avanzar();
});
$("btnAtras").onclick = ev => { ev.stopPropagation(); retroceder(); };
$("btnAdelante").onclick = ev => { ev.stopPropagation(); avanzar(); };
$("tira").onclick = ev => {
  ev.stopPropagation();
  const r = $("tira").getBoundingClientRect();
  s = Math.max(1, Math.round((ev.clientX - r.left) / r.width * libro.T));
  aplicar(true);
};
document.addEventListener("keydown", ev => {
  if (ev.target.closest && ev.target.closest("input,textarea,button,select")) return;
  if (["ArrowRight", "PageDown", " ", "Enter"].includes(ev.key)) { ev.preventDefault(); avanzar(); }
  else if (["ArrowLeft", "PageUp", "Backspace"].includes(ev.key)) { ev.preventDefault(); retroceder(); }
  else if (ev.key === "Home") { s = 1; aplicar(true); }
  else if (ev.key === "End") { s = libro.T; aplicar(true); }
});
let tRes = null;
window.addEventListener("resize", () => {
  clearTimeout(tRes);
  tRes = setTimeout(() => { if (libro) { construir(); Lprev = 0; aplicar(false); } }, 150);
});

window.addEventListener("load", () => cargar(0, false));
</script>
